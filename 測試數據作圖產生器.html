function calcSlope(dataArr, chart) {
  const xs = chart.scales.x;
  if (!xs) return null;
  const optMin = chart.options.scales.x.min;
  const optMax = chart.options.scales.x.max;
  const xMin = optMin !== undefined ? Math.round(optMin) : 0;
  const xMax = optMax !== undefined ? Math.round(optMax) : dataArr.length - 1;
  if (xMin >= xMax || xMin < 0 || xMax >= dataArr.length) return null;
  const d = dataArr.slice(xMin, xMax + 1);
  const n = d.length;
  if (n < 3) return null;
  let sx = 0, sy = 0, sxy = 0, sx2 = 0;
  for (let i = 0; i < n; i++) { sx += i; sy += d[i]; sxy += i * d[i]; sx2 += i * i; }
  const m = (n * sxy - sx * sy) / (n * sx2 - sx * sx);
  const b = (sy - m * sx) / n;
  const my = sy / n;
  let ssr = 0, sst = 0;
  for (let i = 0; i < n; i++) { ssr += (d[i] - (m * i + b)) ** 2; sst += (d[i] - my) ** 2; }
  const r2 = sst > 0 ? 1 - ssr / sst : 0;
  return { m, b, r2, n, xMin };
}

// Simple CSV line parser (handles quoted fields)
function parseCSVLine(line, delim) {
  const d = delim || ',';
  const result = [];
  let current = '';
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuote = !inQuote;
    } else if (ch === d && !inQuote) {
      result.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

// 自動判斷分隔符：Tab / 逗號 / 分號 / 連續空白
// 某些儀器檔（如 FuelCell .fcd）開頭有大量檔頭說明，
// 真正的欄位標題列從 'Time (Sec)' 開始 → 先切除前導檔頭與 'End Comments' 標記
function stripPreamble(text) {
  let lines = String(text).split(/\r?\n/);
  const start = lines.findIndex(function(l) { return /(^|[\t,;]|\s)\s*Time\s*\(Sec\)/i.test(l); });
  if (start > 0) lines = lines.slice(start);
  lines = lines.filter(function(l) { return !/^\s*End\s+Comments\s*$/i.test(l); });
  return lines.join('\n');
}

function detectDelim(text) {
  const lines = String(text).split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (!l.trim()) continue;
    const tabs = (l.match(/\t/g) || []).length;
    const commas = (l.match(/,/g) || []).length;
    const semis = (l.match(/;/g) || []).length;
    if (tabs >= commas && tabs >= semis && tabs > 0) return '\t';
    if (commas >= semis && commas > 0) return ',';
    if (semis > 0) return ';';
    // 整列以空白分隔（例如用空格對齊的儀器輸出）
    if (/^\s*\S+(\s{2,}\S+)+\s*$/.test(l)) return /(\s{2,})/.exec(l)[1];
    return ',';   // 單欄資料（如流水號 A 欄）
  }
  return ',';
}

function buildCharts(times, series, labels, numericCols, headers, timeCol) {
  const nCols = numericCols.length;

  // Stats
  const r2 = v => Math.round(v * 100) / 100;
  const st = (arr) => {
    if (arr.length === 0) return { min: 0, max: 0, avg: 0 };
    return { min: r2(Math.min(...arr)), max: r2(Math.max(...arr)), avg: r2(arr.reduce((a,b) => a+b, 0) / arr.length) };

  // Combined chart
  (function() {

    // Each numeric column gets its own Y-axis, alternating left/right

    let ci = 0;

    const getColor = () => {
      let color;
      for (let attempt = 0; attempt < 20; attempt++) {
        color = colors[ci % colors.length];
        ci++;
        if (!usedColors.has(color)) { usedColors.add(color); return color; }

    numericCols.forEach((col, i) => {

            const y0 = ctx.p0.parsed.y, y1 = ctx.p1.parsed.y;

      if (plotlineEnabled) syncZoomEnabledByPlotline();

      // Slope button

      const slopeAllBtn = document.createElement('button');
      slopeAllBtn.textContent = '📈 全部斜率';
      slopeAllBtn.style.cssText = 'background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-border);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;margin-left:8px';
      const resultAllDiv = document.createElement('div');

      // Y-axis range configuration panel（多欄垂直排列，同選擇畫面）

          + '<button class="allThApply" data-i="' + i + '" style="background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border);padding:2px 12px;border-radius:3px;cursor:pointer;font-size:11px;margin-right:4px">套用</button>'
          + '<button class="allThReset" data-i="' + i + '" style="background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-border);padding:2px 12px;border-radius:3px;cursor:pointer;font-size:11px">歸零</button>';

  // Helpers for individual charts reordering / deletion (拖曳由 Sortable.js 處理)
  let curIndPage = 0;
  let showIndividualPage = null;
  function reflowIndividualPages(focusId) {
    const containers = [];
    pages.forEach(function(p) { Array.from(p.children).forEach(function(el) { if (el.classList.contains('chart-container')) containers.push(el); }); });
    let focusIdx = -1;
    if (focusId) {
      for (let k = 0; k < containers.length; k++) {
        const cv = containers[k].querySelector('canvas');
        if (cv && cv.id === focusId) { focusIdx = k; break; }
      }
    }
    pages.forEach(function(p) { p.remove(); });
    pages.length = 0;
    let curPage = null;
    containers.forEach(function(cEl, idx) {
      if (idx % perPage === 0) {
        curPage = document.createElement('div');
        curPage.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;align-items:start';
        indWrap.appendChild(curPage);
        pages.push(curPage);
      }
      curPage.appendChild(cEl);
      const ch = cEl.querySelector('canvas') ? Chart.getChart(cEl.querySelector('canvas').id) : null;
      if (ch) { try { ch.resize(); } catch(e) {} }
    });
    const nav = document.getElementById('indNav');
    if (nav) {
      if (pages.length <= 1) nav.style.display = 'none';
      else {
        nav.style.display = '';
        let showIdx = curIndPage;
        if (focusIdx >= 0) showIdx = Math.floor(focusIdx / perPage);
        showIdx = Math.max(0, Math.min(showIdx, pages.length - 1));
        if (showIndividualPage) showIndividualPage(showIdx);
        else {
          pages.forEach(function(p, pi) { p.style.display = pi === showIdx ? 'grid' : 'none'; });
          const info = document.getElementById('indPageInfo');
          if (info) info.textContent = '第 ' + (showIdx + 1) + ' / ' + pages.length + ' 頁';
          const prev = document.getElementById('indPrev'), next = document.getElementById('indNext');
          if (prev) prev.disabled = showIdx === 0;
          if (next) next.disabled = showIdx >= pages.length - 1;
          curIndPage = showIdx;
        }
      }
    }
  }

    const ch = Chart.getChart(id);

      const chart = new Chart(canvas, {
        type: 'line',
        data: { labels, datasets: [{
          label: title,
          data: dataArr,
          borderColor: color,
          backgroundColor: color + '33',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.1,
          fill: false,
          segment: {
            borderColor: function(ctx) {
              const lo = ctx.chart._thLo, hi = ctx.chart._thHi;
              if (lo === undefined || hi === undefined) return color;
              const y0 = ctx.p0.parsed.y, y1 = ctx.p1.parsed.y;
              if (y0 < lo || y1 < lo || y0 > hi || y1 > hi) return '#ff453a';
              return color;
            },
            borderWidth: function(ctx) {
              const lo = ctx.chart._thLo, hi = ctx.chart._thHi;
              if (lo === undefined || hi === undefined) return 2;
              const y0 = ctx.p0.parsed.y, y1 = ctx.p1.parsed.y;
              if (y0 < lo || y1 < lo || y0 > hi || y1 > hi) return 3;
              return 2;
            },
          },
        }]},
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'nearest', axis: 'x', intersect: false },
          plugins: {
            legend: { labels: { color: ct('legend'), font: { size: 11 } } },
            tooltip: {
              backgroundColor: 'rgba(28,28,30,0.94)', titleColor: '#0a84ff', bodyColor: '#f5f5f7',
              borderColor: 'rgba(255,255,255,0.14)', borderWidth: 1,
            },
            zoom: {
              zoom: {
                wheel: { enabled: false },
                drag: { enabled: true, threshold: 10, backgroundColor: 'rgba(10,132,255,0.12)', borderColor: '#0a84ff', borderWidth: 1.5 },
                mode: 'xy',
                onZoomComplete: function(e) { applyZoomSync(e.chart); },
              },
              pan: { enabled: true, mode: 'xy', modifierKey: 'shift', onPanComplete: function(e) { applyZoomSync(e.chart); } },
            },
          },
          scales: {
            x: {
              ticks: { color: ct('xtick'), font: { size: 11 }, maxTicksLimit: 20 },
              grid: { color: ct('grid') },
              title: { display: true, text: timeCol >= 0 ? (times[0] instanceof Date ? '時間' : headers[timeCol]) : '索引', color: ct('axisTitle') },
            },
            y: {
              display: true,
              title: { display: true, text: unit, color: color },
              ticks: { color: color },
              grid: { color: ct('grid') },
            },
          },
        },
      });
      setupCrosshair(chart, canvas, labels);
      setupPlotline(chart, canvas, labels, [colIdx]);
      setupAxisEdit(chart, canvas, labels, times, timeCol);
      allCharts.push(chart);
      if (plotlineEnabled) syncZoomEnabledByPlotline();

      const hintDiv = c.querySelector('.zoom-hint');
      const slopeBtn = document.createElement('button');
      slopeBtn.textContent = '📈 斜率';
      slopeBtn.style.cssText = 'background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-border);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;margin-left:8px';
      const resultDiv = document.createElement('div');
      resultDiv.setAttribute('data-role', 'slope-result');
      resultDiv.style.cssText = 'text-align:center;color:var(--result-fg);font-size:12px;margin-top:4px;min-height:18px';
      c.appendChild(resultDiv);
      slopeBtn.onclick = function() {
        const r = calcSlope(dataArr, chart);
        if (!r) { resultDiv.textContent = '請先拖曳縮放選擇範圍'; return; }
        const regData = new Array(labels.length).fill(null);
        for (let i = r.xMin; i < r.xMin + r.n; i++) regData[i] = r.m * (i - r.xMin) + r.b;
        const ri = chart.data.datasets.findIndex(d => d._reg);
        if (ri >= 0) chart.data.datasets.splice(ri, 1);
        chart.data.datasets.push({
          _reg: true, label: '迴歸 (斜率=' + r.m.toFixed(4) + ')', data: regData,
          borderColor: '#ff0000', borderWidth: 2, borderDash: [6,3], pointRadius: 0, fill: false,
          yAxisID: chart.data.datasets[0].yAxisID || 'y',
        });
        chart.update();
        resultDiv.textContent = '斜率 = ' + r.m.toFixed(4) + '  截距 = ' + r.b.toFixed(2) + '  R² = ' + r.r2.toFixed(4) + '  (n=' + r.n + ')';
      };
      hintDiv.appendChild(slopeBtn);

      // Threshold apply/reset handlers
      c.querySelector('.thApply').addEventListener('click', function() {
        const loVal = document.getElementById('thLo_' + id).value;
        const hiVal = document.getElementById('thHi_' + id).value;
        chart._thLo = loVal !== '' ? parseFloat(loVal) : undefined;
        chart._thHi = hiVal !== '' ? parseFloat(hiVal) : undefined;
        chart.update();
      });
      c.querySelector('.thReset').addEventListener('click', function() {
        document.getElementById('thLo_' + id).value = '';
        document.getElementById('thHi_' + id).value = '';
        chart._thLo = undefined;
        chart._thHi = undefined;
        chart.update();
      });
    } catch(e) { /**/ }
  }

  const indWrap = document.createElement('div');
  indWrap.style.cssText = 'margin-bottom:20px';
  chartsDiv.appendChild(indWrap);
  const indGrid = document.createElement('div');
  indGrid.id = 'indGrid';
  indGrid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;align-items:start';
  indWrap.appendChild(indGrid);
  const perPage = 9999;
  const pages = [indGrid];
  numericCols.forEach((col, i) => {
    const colName = headers[col];
    makeChart('ch' + i, colName, series[col], colName, colors[i % colors.length], indGrid, i);
  });
  // Sortable.js 平滑拖曳排序（加速自動捲動）
  if (typeof Sortable !== 'undefined' && indGrid) {
    new Sortable(indGrid, {
      animation: 200,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      dragClass: 'sortable-drag',
      handle: '.drag-handle',
      scroll: true,
      scrollSensitivity: 100,
      scrollSpeed: 35,
      bubbleScroll: true,
      onEnd: function() {
        indGrid.querySelectorAll('canvas').forEach(function(cv) {
          const ch = Chart.getChart(cv.id);
          if (ch) try { ch.resize(); } catch(e) {}
        });
      }
    });
  }
}


</script>
</body>
</html>
