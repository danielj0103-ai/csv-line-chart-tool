* { margin: 0; padding: 0; box-sizing: border-box; }

  --shadow:0 1px 2px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.4);
  --danger:#ff453a;
}
body.light {
  /* 淺色：systemGroupedBackground + 白卡片 */
  --page-bg:#f2f2f7; --text:#1d1d1f;
  --panel:#ffffff; --panel-deep:#f2f2f7;
  --file-bg:#0071e3; --file-hover:#0077ed; --file-fg:#ffffff;
  --btn-bg:#f2f2f7; --btn-fg:#1d1d1f; --btn-border:rgba(0,0,0,0.08);
  --btn-hover:#e5e5ea; --btn-hover-fg:#000000;
  --input-bg:#ffffff; --input-fg:#1d1d1f; --input-border:rgba(0,0,0,0.16);
  --accent:#0071e3;
  --muted:rgba(60,60,67,0.6); --stat:rgba(60,60,67,0.75);
  --dim:rgba(60,60,67,0.4); --tick:rgba(60,60,67,0.85);
  --out-bg:#f2f2f7; --result-fg:#1d1d1f;
  --hairline:rgba(0,0,0,0.08);
  --shadow:0 1px 2px rgba(0,0,0,0.04), 0 8px 28px rgba(0,0,0,0.06);

}
body {
  background:var(--page-bg); color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
              "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-0.01em;
  padding:36px 20px 64px;

}
::selection { background:var(--accent); color:#fff; }

/* 內容置中，維持閱讀寬度（只作用在最外層容器，不影響 grid 內的個別圖） */
.controls, #columnConfig, #loading, .stats, #charts, #multiCharts, #ivCharts {
  max-width:1440px; margin-left:auto; margin-right:auto;
}

h1 { text-align:center; margin-bottom:28px; color:var(--text); font-size:34px; font-weight:700; letter-spacing:-0.025em; }
.subtitle { text-align:center; color:var(--muted); font-size:14px; font-weight:400; margin-bottom:28px; letter-spacing:0; }

/* 藥丸按鈕 + focus ring */
.controls { text-align:center; margin-bottom:28px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; }
.controls label {
  background:var(--file-bg); color:var(--file-fg);
  padding:11px 22px; border-radius:980px; cursor:pointer; display:inline-block;
  font-size:14px; font-weight:590; letter-spacing:-0.01em; user-select:none;
  box-shadow:0 1px 2px rgba(0,0,0,0.12);
  transition:transform .18s cubic-bezier(.25,.8,.25,1), filter .18s;
}
.controls label:hover { filter:brightness(1.08); }
.controls label:active { transform:scale(.97); }
.controls input { display:none; }

canvas { max-width:100%; width:100% !important; cursor:crosshair; }

/* 卡片 */
.chart-container {
  background:var(--panel); border:1px solid var(--hairline);
  border-radius:18px; padding:20px; margin-bottom:20px; box-shadow:var(--shadow);
}
.chart-container h3 { margin-bottom:10px; color:var(--text); font-size:17px; font-weight:600; letter-spacing:-0.015em; }
.chart-wrap { position:relative; height:600px; }

.stats { text-align:center; color:var(--stat); font-size:13px; margin:12px 0 20px; font-variant-numeric:tabular-nums; }
.zoom-hint { text-align:right; font-size:11px; color:var(--dim); margin-top:8px; }
.zoom-hint button {

.zoom-hint button:hover { background:var(--btn-hover); color:var(--btn-hover-fg); }

#loading { display:none; text-align:center; color:var(--accent); font-size:15px; font-weight:500; padding:40px; }
#fileName { margin-left:6px; color:var(--stat); font-size:13px; }

/* 欄位選擇面板 */

  background:var(--panel); border:1px solid var(--hairline); border-radius:18px;
  padding:20px; margin-bottom:20px; display:none; box-shadow:var(--shadow);
}
#columnConfig h4 { color:var(--text); font-size:15px; font-weight:600; margin-bottom:12px; letter-spacing:-0.01em; }

/* 浮動工具列：frosted glass */
#fixedTools {
  position:fixed; top:16px; left:16px; z-index:999; display:flex; gap:4px;

}
#plotlineToggle:hover, #themeToggle:hover { background:var(--btn-hover); color:var(--btn-hover-fg); }
#plotlineToggle.on { background:var(--accent); color:#fff; }

/* Plotline 讀值 */
.plotline-out {
  margin-top:10px; padding:10px 12px; background:var(--out-bg);
  border:1px solid var(--hairline); border-radius:12px; display:none;
  max-height:260px; overflow:auto;
}
.pl-table { border-collapse:collapse; width:100%; font-size:12px; font-variant-numeric:tabular-nums; }
.pl-table th, .pl-table td {
  padding:5px 10px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--hairline);
}
.pl-table thead th {
  color:var(--accent); font-weight:600; text-align:right;
  font-size:11px; letter-spacing:0.01em;
  border-bottom:1px solid var(--accent);
}
.pl-table thead th:first-child, .pl-table tbody td:first-child {
  text-align:center; color:var(--accent); font-weight:600;
}
.pl-table tbody td { color:var(--tick); }
.pl-table tbody tr:hover td { background:rgba(128,128,128,0.1); }
.pl-table tbody tr:last-child td { border-bottom:none; }

/* 圖表選單（popover） */
.chart-menu-btn {
  background:transparent; border:none; color:var(--stat); font-size:16px;
  cursor:pointer; padding:2px 9px; line-height:1; border-radius:8px;
  transition:background .18s, color .18s;
}
.chart-menu-btn:hover { color:var(--text); background:var(--btn-bg); }
.chart-menu {
  display:none; position:absolute; right:0; top:100%; margin-top:5px;
  background:var(--panel); border:1px solid var(--hairline); border-radius:12px;
  box-shadow:var(--shadow); z-index:10; min-width:132px; overflow:hidden;
  backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
}
.chart-menu-item { padding:9px 16px; font-size:13px; color:var(--text); cursor:pointer; white-space:nowrap; }
.chart-menu-item:hover { background:var(--accent); color:#fff; }
.chart-menu-item.danger { color:var(--danger); }
.chart-menu-item.danger:hover { background:var(--danger); color:#fff; }

/* 拖曳排序 */
.chart-container { transition:transform .35s cubic-bezier(.25,.8,.25,1); }
.chart-container.dragging { opacity:.5; }
.chart-container.drop-target { outline:2px solid var(--accent); outline-offset:-4px; border-radius:18px; }
.sortable-ghost { opacity:.35 !important; background:var(--panel) !important; border-radius:18px; }
.sortable-chosen { opacity:.7; }
.sortable-drag { opacity:.9; box-shadow:0 14px 32px rgba(0,0,0,.34); }
.drag-handle { cursor:grab; color:var(--stat); font-size:13px; padding:3px 8px; border-radius:8px; user-select:none; }
.drag-handle:active { cursor:grabbing; }
.drag-handle:hover { color:var(--text); background:var(--btn-bg); }

/* 頁尾作者標籤 */
.app-footer {

}
.app-footer .author { color:var(--stat); font-weight:500; }
.app-footer .ver { opacity:.75; margin-left:8px; }

/* 頁尾下載區 */
.dl-band {
  margin-top:14px; padding-top:16px; border-top:1px solid var(--hairline);
  text-align:center;
}
.dl-band .dl-title {
  color:var(--stat); font-size:12px; margin-bottom:10px;
}
.dl-band .dl-title b { color:var(--accent); font-weight:600; }
.dl-band .dl-grid {
  display:inline-flex; flex-wrap:wrap; justify-content:center; gap:8px;
}
.dl-band .dl-grid a {
  display:inline-block; text-decoration:none;

  box-shadow:var(--shadow);
  transition:filter .18s, transform .12s;
}
.dl-band .dl-grid a:hover { filter:brightness(1.12); }
.dl-band .dl-grid a:active { transform:translateY(1px); }
@media (max-width:560px) { .dl-band .dl-grid a { width:100%; } }

<script>
// 下載備援：主程式連結是「相對自己的路徑」，若檔案被改名或換資料夾開，
// fetch 會失敗，此時改以目前頁面內容產生 Blob 讓下載仍然可用。
(function () {
  var TOOL = document.getElementById('dlTool');
  if (!TOOL) return;
  var fallback = false;
  fetch(TOOL.getAttribute('href'), { method: 'GET', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); })
    .catch(function () { fallback = true; })
    .then(function () { _ready(fallback); });

  function _ready(useFallback) {
    TOOL.addEventListener('click', function (e) {
      if (!useFallback) return;              // 連結正常就讓瀏覽器自己處理
      e.preventDefault();
      var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      var url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = TOOL.getAttribute('download') || '測試數據作圖產生器.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    });
  }
})();
</script>

<script>
if (typeof ChartZoom !== 'undefined') Chart.register(ChartZoom);

// All active charts, for TradingView-style X-axis sync
const allCharts = [];
let syncSuppress = false;

// Plotline read-value mode
let plotlineEnabled = false;
let plotlineCount = 0;
let plotlineData = null; // { times, series, numericCols, headers, timeCol }
// IV 曲線專屬的 Plotline 狀態（與一般折線圖各自獨立計次與顯示）
let ivPlotlineCount = 0;
let ivCrosshairX = null;   // 游標所在處的 X 值（電流）
let ivPlotlineMarks = [];  // [{ x, n }]
let ivPlotlineRecords = [];// [{ n, sortKey, cells: [{ label, text }] }]

function applyZoomSync(srcChart) {
  if (syncSuppress) return;
  const xs = srcChart && srcChart.options && srcChart.options.scales && srcChart.options.scales.x;
  if (!xs) return;
  const mn = xs.min, mx = xs.max;
  const hasZoom = mn !== undefined && mx !== undefined;
  syncSuppress = true;
  try {
    allCharts.forEach(ch => {
      if (ch === srcChart) return;
      const s = ch.options && ch.options.scales && ch.options.scales.x;
      if (!s) return;
      if (hasZoom) {
        if (ch.zoomScale) ch.zoomScale('x', { min: mn, max: mx }, 'none');
      } else {
        if (ch.resetZoom) ch.resetZoom();
      }
    });
  } finally {
    syncSuppress = false;
  }
}

// Crosshair sync state — mouse X position shared across all charts
const crosshairState = { x: -1 };

// 重繪請求合併到同一個 animation frame，避免連續點擊／滑動時重複觸發繪製
let redrawPending = false;
function redrawAllCharts() {
  if (redrawPending) return;
  redrawPending = true;
  const run = function() {
    redrawPending = false;
    // 用公開的 render() 重繪；不可用 draw()（Chart.js 內部 API，會讓渲染狀態不同步）。
    // 同時略過目前不可見的圖表，避免對 0 尺寸的畫布繪製。
    allCharts.forEach(function(ch) {
      try {
        if (!ch.canvas || !ch.canvas.offsetParent) return;
        ch.render();
      } catch(e) {}
    });
  };
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(run);
  else setTimeout(run, 16);
}

Chart.register({
  id: 'crosshairSync',
  afterDraw(chart) {
    if (chart.$isIV) return;
    const ctx = chart.ctx;
    const xs = chart.scales.x;
    const ca = chart.chartArea;
    const marks = chart._plotlineMarks;
    if (xs && ca && marks && marks.length) {
      ctx.save();
      ctx.strokeStyle = chart._plotlineStroke || 'rgba(255,217,61,0.6)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      const drawn = [];
      marks.forEach(function(mk) {
        const px = xs.getPixelForValue(mk.x);
        if (px < ca.left || px > ca.right) return;
        ctx.moveTo(px, ca.top);
        ctx.lineTo(px, ca.bottom);
        drawn.push({ px, n: mk.n });
      });
      ctx.stroke();
      ctx.font = 'bold 10px Consolas, monospace';
      ctx.textAlign = 'left';
      const labelColor = chart._plotlineLabel || '#0a84ff';
      drawn.forEach(function(d) {
        const label = String(d.n).padStart(2, '0');
        const tx = d.px + 2;
        const ty = ca.top + 10;
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(tx - 1, ty - 8, tw + 2, 11);
        ctx.fillStyle = labelColor;
        ctx.fillText(label, tx, ty);
      });
      ctx.restore();
    }
    const idx = crosshairState.x;
    if (idx < 0) return;
    if (!xs || !ca) return;
    const px = xs.getPixelForValue(idx);
    if (px < ca.left || px > ca.right) return;
    ctx.save();
    ctx.strokeStyle = isLightTheme() ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(px, ca.top);
    ctx.lineTo(px, ca.bottom);
    ctx.stroke();
    ctx.restore();
  },
});

// IV 曲線專屬的 Plotline 繪圖（垂直線 + 編號 + 游標）
Chart.register({
  id: 'ivCrosshairSync',
  afterDraw(chart) {
    if (!chart.$isIV) return;
    if (!plotlineEnabled) return;
    const ctx = chart.ctx;
    const xs = chart.scales.x;
    const ca = chart.chartArea;
    if (!xs || !ca) return;

    // 已固定的讀值線
    if (ivPlotlineMarks.length) {
      ctx.save();
      ctx.strokeStyle = 'rgba(10,132,255,0.75)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      const drawn = [];
      ivPlotlineMarks.forEach(function(mk) {
        const px = xs.getPixelForValue(mk.x);
        if (px < ca.left || px > ca.right) return;
        ctx.moveTo(px, ca.top);
        ctx.lineTo(px, ca.bottom);
        drawn.push({ px: px, n: mk.n });
      });
      ctx.stroke();
      ctx.font = 'bold 10px "SF Mono", ui-monospace, Menlo, monospace';
      ctx.textAlign = 'left';
      drawn.forEach(function(d) {
        const label = String(d.n).padStart(2, '0');
        const tx = d.px + 2, ty = ca.top + 10;
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(tx - 1, ty - 8, tw + 2, 11);
        ctx.fillStyle = '#0a84ff';
        ctx.fillText(label, tx, ty);
      });
      ctx.restore();
    }

    // 游標虛線
    if (ivCrosshairX === null) return;
    const px = xs.getPixelForValue(ivCrosshairX);
    if (px < ca.left || px > ca.right) return;
    ctx.save();
    ctx.strokeStyle = isLightTheme() ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(px, ca.top);
    ctx.lineTo(px, ca.bottom);
    ctx.stroke();
    ctx.restore();
  },
});

// IV 曲線的 Plotline：獨立讀值框、獨立編號（ivPlotline01…）
function setupIVPlotline(chart, canvas) {
  const container = canvas.closest('.chart-container');
  if (!container) return;
  const outDiv = document.createElement('div');
  outDiv.className = 'plotline-out';
  outDiv.id = 'ivPlotlineOut';
  container.appendChild(outDiv);
  chart._plotlineOut = outDiv;

  let dragX = null, dragY = null;
  canvas.addEventListener('mousedown', function(e) {
    dragX = e.clientX; dragY = e.clientY;
  });
  canvas.addEventListener('mousemove', function(e) {
    if (!plotlineEnabled) return;
    if (e.buttons & 1) return;
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (mx < ca.left || mx > ca.right || my < ca.top || my > ca.bottom) {
      if (ivCrosshairX !== null) { ivCrosshairX = null; try { chart.render(); } catch (err) {} }
      return;
    }
    const xs = chart.scales && chart.scales.x;
    if (!xs) return;
    const v = xs.getValueForPixel(mx);
    if (isNaN(v)) return;
    if (ivCrosshairX !== v) { ivCrosshairX = v; try { chart.render(); } catch (err) {} }
  });
  canvas.addEventListener('mouseleave', function() {
    if (ivCrosshairX !== null) { ivCrosshairX = null; try { chart.render(); } catch (err) {} }
  });
  canvas.addEventListener('click', function(e) {
    if (!plotlineEnabled) return;
    if (dragX !== null &&
        (Math.abs(e.clientX - dragX) > 4 || Math.abs(e.clientY - dragY) > 4)) return;
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (mx < ca.left || mx > ca.right || my < ca.top || my > ca.bottom) return;
    const xs = chart.scales && chart.scales.x;
    if (!xs) return;
    const xVal = xs.getValueForPixel(mx);
    if (isNaN(xVal)) return;

    const xName = (ivSel.xi >= 0 && ivRefSeries().headers[ivSel.xi]) || 'X';

    // 每條曲線取 X 最接近的點（記錄所屬 dataset 索引，隱藏時可同步從表格移除）
    const cells = [{ label: xName, text: xVal.toFixed(4) }];
    const vis = [];              // 依序記錄可見曲線，用於計算前-後性能差異
    let nearestY = NaN, nearestDs = -1;
    (chart.data.datasets || []).forEach(function(ds, dsIdx) {
      if (ds.hidden) return;
      if (ds.yAxisID === 'yPow') return;          // 功率曲線另外用 I×V 表示
      const pts = ds.data || [];
      if (!pts.length) return;
      let best = null, bestD = Infinity;
      for (let i = 0; i < pts.length; i++) {
        const d = Math.abs(pts[i].x - xVal);
        if (d < bestD) { bestD = d; best = pts[i]; }
      }
      if (best) {
        cells.push({
          label: ds.label.replace(/ \(V\)$/, ''),
          text: (+best.y).toFixed(4),
          ds: dsIdx
        });
        vis.push({ ds: dsIdx, v: +best.y });
        if (isNaN(nearestY)) { nearestY = best.y; nearestDs = dsIdx; }
      }
    });

    // 性能差異：第一條可見曲線 − 第二條可見曲線，置於 P (W) 之前
    let diff = null;
    if (vis.length >= 2) {
      const dV = vis[0].v - vis[1].v;
      diff = { ds: [vis[0].ds, vis[1].ds], v0: vis[0].v, v1: vis[1].v };
      cells.push({ label: '前-後(V)', text: dV.toFixed(3), isDiff: true });
      cells.push({ label: '前-後(mV)', text: (dV * 1000).toFixed(0), isDiff: true });
    }

    if (!isNaN(nearestY)) cells.push({ label: 'P (W)', text: (xVal * nearestY).toFixed(3) });

    ivPlotlineCount++;
    ivPlotlineRecords.push({
      n: ivPlotlineCount, sortKey: xVal, cells: cells,
      pDs: nearestDs, pY: nearestY, xVal: xVal, diff: diff
    });
    renderPlotlineTable(outDiv, ivPlotlineRecords, true, ivDatasetColors());   // IV：以電流由小到大
    ivPlotlineMarks.push({ x: xVal, n: ivPlotlineCount });
    try { chart.render(); } catch (err) {}
  });
}

// 資料集是否可見：一般圖用 meta.hidden，IV 圖用 dataset.hidden，兩者都要檢查
function isDatasetVisible(ch, idx) {
  const ds = ch && ch.data && ch.data.datasets && ch.data.datasets[idx];
  if (!ds) return false;
  if (ds.hidden) return false;
  try {
    const meta = ch.getDatasetMeta(idx);
    if (meta && meta.hidden === true) return false;
  } catch (e) {}
  return true;
}

// 清空指定折線圖的 Plotline 讀值：圖上的垂直標記＋底下表格
function clearChartPlotline(ch) {
  if (!ch) return;
  ch._plotlineMarks = [];
  ch._plotlineRecords = [];
  const el = ch._plotlineOut;
  if (el) { el.innerHTML = ''; el._plHtml = ''; el.style.display = 'none'; }
  try { ch.render(); } catch (e) {}
  // 序號由所有折線圖共用：仍有其他圖保留讀值時不歸零，避免序號重複
  const rest = (allCharts || []).some(function(c) {
    return c !== ch && c._plotlineRecords && c._plotlineRecords.length;
  });
  if (!rest) plotlineCount = 0;
}

// 清空 IV 讀值狀態：圖上的垂直標記＋底下表格，序號重新從 01 開始
function clearIVPlotline() {
  ivPlotlineCount = 0;
  ivPlotlineMarks = [];
  ivPlotlineRecords = [];
  ivCrosshairX = null;
  const el = document.getElementById('ivPlotlineOut');
  if (el) { el.innerHTML = ''; el._plHtml = ''; el.style.display = 'none'; }
  if (ivChart) { try { ivChart.render(); } catch (e) {} }
}

// IV 各資料集的線色（依資料集索引排列），供表格標題對應著色
function ivDatasetColors() {
  const arr = [];
  const list = (ivChart && ivChart.data && ivChart.data.datasets) || [];
  list.forEach(function(ds) {
    arr.push(typeof ds.borderColor === 'string' ? ds.borderColor : '');
  });
  return arr;
}

// 圖例切換顯示／隱藏後，依目前的可見狀態重建 Plotline 表格欄位
function refreshIVPlotlineTable() {
  const outDiv = document.getElementById('ivPlotlineOut');
  if (!outDiv || !ivPlotlineRecords.length) return;
  const filtered = ivPlotlineRecords.map(function(r) {
    const cells = r.cells.filter(function(c) {
      return c.ds === undefined || isDatasetVisible(ivChart, c.ds);
    });
    // P (W) 依據「點擊當下最前面那條可見曲線」計算，
    // 若該曲線已被隱藏，P 也一併移除，避免顯示看不見的來源
    if (r.pDs >= 0 && !isDatasetVisible(ivChart, r.pDs)) {
      for (let i = cells.length - 1; i >= 0; i--) {
        if (cells[i].label === 'P (W)') cells.splice(i, 1);
      }
    }
    // 前-後 差異值來自前兩條可見曲線，任一被隱藏即無法計算 → 一併移除
    if (r.diff && (!isDatasetVisible(ivChart, r.diff.ds[0]) ||
                   !isDatasetVisible(ivChart, r.diff.ds[1]))) {
      for (let i = cells.length - 1; i >= 0; i--) {
        if (cells[i].isDiff) cells.splice(i, 1);
      }
    }
    return { n: r.n, sortKey: r.sortKey, cells: cells };
  });
  renderPlotlineTable(outDiv, filtered, true, ivDatasetColors());   // IV：以電流由小到大
}

function refreshLinePlotlineTable(chart) {
  if (!chart || !chart._plotlineRecords || !chart._plotlineRecords.length) return;
  const outDiv = chart._plotlineOut;
  if (!outDiv) return;
  const filtered = chart._plotlineRecords.map(function(r) {
    return {
      n: r.n, sortKey: r.sortKey,
      cells: r.cells.filter(function(c) {
        return c.ds === undefined || isDatasetVisible(chart, c.ds);
      })
    };
  });
  renderPlotlineTable(outDiv, filtered);
}

function setupCrosshair(chart, canvas, labels) {
  canvas.addEventListener('mousemove', function(e) {
    if (e.buttons & 1) return;
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (mx < ca.left || mx > ca.right || my < ca.top || my > ca.bottom) {
      if (crosshairState.x !== -1) { crosshairState.x = -1; redrawAllCharts(); }
      return;
    }
    const xs = chart.scales && chart.scales.x;
    if (!xs) return;
    const raw = xs.getValueForPixel(mx);
    let xIdx;
    if (typeof raw === 'number') xIdx = Math.round(raw);
    else if (typeof raw === 'string') xIdx = labels.indexOf(raw);
    else xIdx = Math.round(parseFloat(raw));
    if (xIdx < 0 || xIdx >= labels.length) return;
    if (crosshairState.x !== xIdx) {
      crosshairState.x = xIdx;
      redrawAllCharts();
    }
  });
  canvas.addEventListener('mouseleave', function() {
    if (crosshairState.x !== -1) { crosshairState.x = -1; redrawAllCharts(); }
  });
}

// cols: array of numericCols indices this chart should show values for
function parseColor(str) {
  if (!str) return null;
  let s = String(str).trim();
  let m = s.match(/^#([0-9a-fA-F]{6})$/);
  if (m) return { r: parseInt(m[1].slice(0, 2), 16), g: parseInt(m[1].slice(2, 4), 16), b: parseInt(m[1].slice(4, 6), 16) };
  m = s.match(/^#([0-9a-fA-F]{3})$/);
  if (m) { const x = m[1]; return { r: parseInt(x[0] + x[0], 16), g: parseInt(x[1] + x[1], 16), b: parseInt(x[2] + x[2], 16) }; }
  m = s.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  if (m) return { r: +m[1], g: +m[2], b: +m[3] };
  return null;
}
function colorDist(a, b) { return Math.sqrt((a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2); }
const PLOTLINE_COLORS = [
  { stroke: 'rgba(10,132,255,0.75)', label: '#0a84ff', rgb: { r: 10, g: 132, b: 255 } },
  { stroke: 'rgba(255,55,95,0.75)', label: '#ff375f', rgb: { r: 255, g: 55, b: 95 } },
  { stroke: 'rgba(48,209,88,0.75)', label: '#30d158', rgb: { r: 48, g: 209, b: 88 } },
  { stroke: 'rgba(255,255,255,0.7)', label: '#ffffff', rgb: { r: 255, g: 255, b: 255 } },
  { stroke: 'rgba(191,90,242,0.75)', label: '#bf5af2', rgb: { r: 191, g: 90, b: 242 } },
];
// In light mode white/yellow lines are hard to see — swap them for darker ones
function plotlineCandidates() {
  if (!isLightTheme()) return PLOTLINE_COLORS;
  return PLOTLINE_COLORS.map(c => {
if (c.label === '#ffffff') return { stroke: 'rgba(40,40,40,0.65)', label: '#333333', rgb: { r: 40, g: 40, b: 40 } };
  if (c.label === '#0a84ff') return { stroke: 'rgba(0,113,227,0.7)', label: '#0071e3', rgb: { r: 0, g: 113, b: 227 } };
  if (c.label === '#30d158') return { stroke: 'rgba(36,138,61,0.7)', label: '#248a3d', rgb: { r: 36, g: 138, b: 61 } };
    return c;
  });
}
// Plotline 讀值表格：第一欄＝序號、第一列＝各欄標籤
// records: [{ n, sortKey, cells: [{ label, text }] }]
function renderPlotlineTable(outDiv, records, asc, dsColors) {
  if (!outDiv) return;
  // asc 為 true 時由小到大排序（IV 曲線以電流排序）；未指定則由大到小
  // dsColors：依資料集索引排列的線色陣列，讓標題依對應曲線著色
  const list = records.slice().sort(function(a, b) {
    return asc ? (a.sortKey - b.sortKey) : (b.sortKey - a.sortKey);
  });
  if (!list.length) { outDiv.innerHTML = ''; outDiv.style.display = 'none'; return; }
  const labels = [], labelDs = {};
  list.forEach(function(r) {
    r.cells.forEach(function(c) {
      if (labels.indexOf(c.label) < 0) {
        labels.push(c.label);
        if (c.ds !== undefined) labelDs[c.label] = c.ds;
      }
    });
  });
  let html = '<table class="pl-table"><thead><tr><th>序號</th>';
  labels.forEach(function(l) {
    const dsi = labelDs[l];
    const col = (dsi !== undefined && dsColors) ? dsColors[dsi] : '';
    html += '<th' + (col ? ' style="color:' + escHtml(col) + '"' : '') + '>' + escHtml(l) + '</th>';
  });
  html += '</tr></thead><tbody>';
  list.forEach(function(r) {
    html += '<tr><td>' + String(r.n).padStart(2, '0') + '</td>';
    labels.forEach(function(l) {
      let cell = null;
      for (let i = 0; i < r.cells.length; i++) if (r.cells[i].label === l) { cell = r.cells[i]; break; }
      html += '<td>' + (cell ? escHtml(cell.text) : '') + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  // 內容沒變就不碰 DOM，避免連續點擊時反覆重建造成畫布重繪異常
  if (outDiv._plHtml !== html) {
    outDiv._plHtml = html;
    outDiv.innerHTML = html;
  }
  outDiv.style.display = 'block';
}

function setupPlotline(chart, canvas, labels, cols) {
  const container = canvas.closest('.chart-container');
  if (!container) return;
  const outDiv = document.createElement('div');
  outDiv.className = 'plotline-out';
  container.appendChild(outDiv);
  chart._plotlineOut = outDiv;
  chart._plotlineMarks = [];
  chart._plotlineRecords = [];
  const lineColors = (chart.data.datasets || []).map(ds => parseColor(ds.borderColor)).filter(Boolean);
  const CANDS = plotlineCandidates();
  let picked = CANDS[0];
  for (const c of CANDS) {
    const tooClose = lineColors.some(lc => colorDist(lc, c.rgb) < 80);
    if (!tooClose) { picked = c; break; }
  }
  chart._plotlineStroke = picked.stroke;
  chart._plotlineLabel = picked.label;
  let dragStartX = null, dragStartY = null;
  canvas.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
  });
  canvas.addEventListener('click', function(e) {
    if (!plotlineEnabled || !plotlineData) return;
    if (dragStartX !== null &&
        (Math.abs(e.clientX - dragStartX) > 4 || Math.abs(e.clientY - dragStartY) > 4)) return;
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (mx < ca.left || mx > ca.right || my < ca.top || my > ca.bottom) return;
    const xs = chart.scales && chart.scales.x;
    if (!xs) return;
    const raw = xs.getValueForPixel(mx);
    let xIdx;
    if (typeof raw === 'number') xIdx = Math.round(raw);
    else if (typeof raw === 'string') xIdx = labels.indexOf(raw);
    else xIdx = Math.round(parseFloat(raw));
    if (xIdx < 0 || xIdx >= labels.length) return;
    plotlineCount++;
    const d = plotlineData;
    const xHeader = d.timeCol >= 0 ? (d.headers[d.timeCol] || 'X') : '索引';
    const xVal = d.xIsTime ? fmtTimeShort(d.times[xIdx]) : String(d.times[xIdx]);
    const cells = [{ label: xHeader, text: xVal }];
    cols.forEach(function(ci, i) {
      const col = d.numericCols[ci];
      // ds：對應的 dataset 索引（dataset 與 cols 同序建立），
      // 供圖例切換顯示時同步從表格移除該欄
      cells.push({
        label: d.headers[col] || ('欄' + (col + 1)),
        text: String(d.series[col][xIdx]),
        ds: i
      });
    });
    chart._plotlineRecords.push({ n: plotlineCount, sortKey: xIdx, cells: cells });
    renderPlotlineTable(outDiv, chart._plotlineRecords);
    chart._plotlineMarks.push({ x: xIdx, n: plotlineCount });
    redrawAllCharts();
  });
}

function parseTime(str) {
  if (!str) return null;
  str = str.replace(/^['"]/, '').trim();
  // 純數值（如 1,2,3 的流水號 sec）不視為日期
  if (/^\d+(\.\d+)?$/.test(str)) return null;
  // Try ISO format first
  let ts = new Date(str);
  if (!isNaN(ts.getTime())) return ts;
  // Try common formats with slashes
  const m = str.match(/(\d{4})[/-](\d{1,2})[/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) {
    ts = new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    if (!isNaN(ts.getTime())) return ts;
  }
  // Try MM/DD/YYYY or DD/MM/YYYY
  const m2 = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m2) {
    ts = new Date(+m2[3], +m2[1]-1, +m2[2], +(m2[4]||0), +(m2[5]||0), +(m2[6]||0));
    if (!isNaN(ts.getTime())) return ts;
  }
  return null;
}

function fmtTime(d) {
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getMonth()+1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function fmtTimeShort(d) {
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

// 依數列名稱尾端單位分組（不分大小寫），如 kPa / NLPM / 度
function getUnitKey(header) {
  let s = String(header).trim();
  // 先嘗試括號內的單位： "xxx (kPa)" / "xxx[度]" / "xxx_度"
  let m = s.match(/[\(\[（【]\s*([^\)\]）】\s]+)\s*[\)\]）】]?\s*$/);
  if (m) return m[1].trim();
  // 去除尾端標點再取最後一個 token
  s = s.replace(/[\s\)\]\}】）]+$/,'');
  let parts = s.split(/[\s_\-\/]+/);
  let last = parts[parts.length - 1] || s;
  last = last.replace(/^[^a-zA-Z0-9\u4e00-\u9fa5°℃]+|[^a-zA-Z0-9\u4e00-\u9fa5°℃]+$/g, '');
  return last || s;
}

// --- Axis manual range edit (double-click on axis) ---
function secOfDay(d) { return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); }
function findIdxByTime(times, str) {
  // 數值 X（如 sec）：直接找最接近的數值
  if (times.length && typeof times[0] === 'number') {
    const v = parseFloat(String(str).trim());
    if (isNaN(v)) return null;
    let best = -1, bestDiff = Infinity;
    for (let i = 0; i < times.length; i++) { const diff = Math.abs(times[i] - v); if (diff < bestDiff) { bestDiff = diff; best = i; } }
    return best;
  }
  const m = String(str).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  let target;
  if (m) target = (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3] || 0);
  else {
    const d = parseTime(str);
    if (!d) return null;
    target = secOfDay(d);
  }
  let best = -1, bestDiff = Infinity;
  for (let i = 0; i < times.length; i++) {
    if (!(times[i] instanceof Date)) continue;
    const diff = Math.abs(secOfDay(times[i]) - target);
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  }
  return best;
}

  ov.addEventListener('click', function(e) { if (e.target === ov) ov.remove(); });
  box.querySelector('.rvCancel').onclick = function() { ov.remove(); };

// 套用刻度間隔到軸設定（空字串 = 自動）
function applyAxisStep(opts, step) {
  if (!opts) return;
  if (!opts.ticks) opts.ticks = {};
  if (step === '' || step === null || step === undefined || isNaN(parseFloat(step))) {
    delete opts.ticks.stepSize;
  } else {
    opts.ticks.stepSize = parseFloat(step);
  }
}
function setupAxisEdit(chart, canvas, labels, times, timeCol) {
  canvas.addEventListener('dblclick', function(e) {
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Y axes: hit-test each scale's horizontal band
    const ids = Object.keys(chart.options.scales || {}).filter(k => k !== 'x');
    for (const id of ids) {
      const sc = chart.scales[id];
      if (!sc) continue;
      if (my >= ca.top - 5 && my <= ca.bottom + 5 && mx >= sc.left - 3 && mx <= sc.right + 3) {
        const axTitle = (sc.options.title && sc.options.title.text) || id;
        const opts = chart.options.scales[id];
        const defLo = opts.min !== undefined ? opts.min : sc.min;
        const defHi = opts.max !== undefined ? opts.max : sc.max;
        const isLinear = sc.type === 'linear';
        const defStep = isLinear && opts.ticks && typeof opts.ticks.stepSize === 'number' ? opts.ticks.stepSize : '';
        askRange('✏️ 手動設定 Y 軸範圍 — ' + axTitle, '起始值', defLo, '結束值', defHi, function(a, b, step) {
          const lo = parseFloat(a), hi = parseFloat(b);
          if (isNaN(lo) || isNaN(hi) || lo >= hi) { alert('請輸入有效數值（起始值需小於結束值）'); return; }
          opts.min = lo;
          opts.max = hi;
          if (isLinear) applyAxisStep(opts, step);
          chart.update('none');
        }, isLinear ? defStep : null);
        return;
      }
    }

    // X axis: band below chart area
    if (mx >= ca.left && mx <= ca.right && my > ca.bottom && my <= ca.bottom + 40) {
      const xs = chart.options.scales.x;
      const n = labels.length;
      let i0 = xs.min !== undefined ? Math.round(xs.min) : 0;
      let i1 = xs.max !== undefined ? Math.round(xs.max) : n - 1;
      // 多檔疊圖時較長檔案的補位標籤（'#i'）沒有任何資料 → 範圍上限收到最後一個有效索引
      let lastReal = n - 1;
      while (lastReal > 0 && typeof labels[lastReal] === 'string' && labels[lastReal].charAt(0) === '#') lastReal--;
      i0 = Math.max(0, Math.min(i0, lastReal));
      i1 = Math.max(0, Math.min(i1, lastReal));
      const xIsTime = times[0] instanceof Date;
      // 多檔疊圖時 X 軸長度取各檔最大值，較長檔案的補位標籤為 '#i' → 改用時間/數值本身
      const labelAt = function (i) {
        const s = labels[i];
        if (typeof s === 'string' && s.charAt(0) === '#') {
          if (xIsTime && times[i] instanceof Date) return fmtTime(times[i]);
          if (i >= 0 && i < times.length) return String(times[i]);
        }
        return s;
      };
      if (xIsTime) {
        askRange('⏱️ 手動設定 X 軸時間範圍', '起始時間 (HH:mm:ss)', labelAt(i0), '結束時間 (HH:mm:ss)', labelAt(i1), function(a, b) {
          const j0 = findIdxByTime(times, a);
          const j1 = findIdxByTime(times, b);
          if (j0 === null || j1 === null || j0 < 0 || j1 < 0) { alert('時間格式無法辨識，請輸入 HH:mm:ss'); return; }
          if (j0 >= j1) { alert('起始時間需早於結束時間'); return; }
          xs.min = j0;
          xs.max = j1;
          chart.update('none');
          applyZoomSync(chart);
        });
      } else if (timeCol >= 0) {
        const xHdr = (chart.options.scales.x.title && chart.options.scales.x.title.text) || 'X';
        const xSc = chart.scales.x;
        const xLinear = xSc && xSc.type === 'linear';
        const xStep = xLinear && xs.ticks && typeof xs.ticks.stepSize === 'number' ? xs.ticks.stepSize : '';
        askRange('🔢 手動設定 X 軸範圍 — ' + xHdr, '起始值', labelAt(i0), '結束值', labelAt(i1), function(a, b, step) {
          const j0 = findIdxByTime(times, a);
          const j1 = findIdxByTime(times, b);
          if (j0 === null || j1 === null || j0 < 0 || j1 < 0) { alert('數值格式無法辨識'); return; }
          if (j0 >= j1) { alert('起始值需小於結束值'); return; }
          xs.min = j0;
          xs.max = j1;
          if (xLinear) applyAxisStep(xs, step);
          chart.update('none');
          applyZoomSync(chart);
        }, xLinear ? xStep : null);
      } else {
        askRange('🔢 手動設定 X 軸索引範圍', '起始索引', i0, '結束索引', i1, function(a, b) {
          const j0 = parseInt(a, 10), j1 = parseInt(b, 10);
          if (isNaN(j0) || isNaN(j1) || j0 < 0 || j1 >= n || j0 >= j1) { alert('請輸入有效索引（0 ～ ' + (n - 1) + '，起始需小於結束）'); return; }
          xs.min = j0;
          xs.max = j1;
          chart.update('none');
          applyZoomSync(chart);
        });
      }
    }
  });
}

function isNumeric(val) {
  if (val === null || val === undefined || val === '') return false;
  return !isNaN(parseFloat(val)) && isFinite(val);
}

function decodeGenericBuffer(buf) {
  let text = null;
  if (buf.length >= 3 && buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF) {
    text = new TextDecoder('utf-8').decode(buf);
  } else {
    try { text = new TextDecoder('big5').decode(buf); } catch (e) { text = null; }
    if (text === null || text.indexOf('\uFFFD') !== -1) {
      try { text = new TextDecoder('utf-8').decode(buf); } catch (e) { text = ''; }
    }
  }
  return text.replace(/^\uFEFF/, '');
}

function readFileText(file) {
  return new Promise(function (resolve) {
    const reader = new FileReader();
    reader.onload = function (evt) { resolve(decodeGenericBuffer(new Uint8Array(evt.target.result))); };
    reader.onerror = function () { resolve(null); };
    reader.readAsArrayBuffer(file);
  });
}

// 依欄名合併各檔案的欄位（不分大小寫）
function multiColumnUnion(files) {
  const map = new Map();
  files.forEach(function (f) {
    f.numericCols.forEach(function (c) {
      const raw = (f.headers[c] || ('欄' + (c + 1))).trim();
      const key = raw.toLowerCase();
      if (!map.has(key)) map.set(key, { name: raw, refs: [] });
      map.get(key).refs.push({ file: f, col: c });
    });
  });
  return Array.from(map.values());
}

// 多檔：載入並顯示欄位選擇面板
function loadMultiFiles(fileList) {
  loading.style.display = 'block';
  const room = MULTI_MAX;
  const take = Array.from(fileList).slice(0, room);
  const skipped = fileList.length - take.length;
  Promise.all(take.map(function (f) { return readFileText(f).then(function (t) { return { name: f.name, text: t }; }); }))
    .then(function (items) {
      multiFiles = [];
      items.forEach(function (it) {
        if (!it.text) return;
        const a = analyzeTable(it.text);
        if (!a) return;
        a.name = it.name.replace(/\.[^.]+$/, '');
        multiFiles.push(a);
      });
      loading.style.display = 'none';
      fileName.textContent = '已載入 ' + multiFiles.length + ' 個檔案（共 ' + multiFiles.length + '/' + MULTI_MAX + '）'
        + (skipped ? '，超出上限未載入 ' + skipped + ' 個' : '');
      if (!multiFiles.length) { alert('沒有可用的資料（每個檔案至少要有 2 筆以上資料）'); return; }
      renderMultiPanel();
    });
}

          borderColor: 'rgba(255,255,255,0.14)', borderWidth: 1,
        },
        zoom: {
          zoom: {
            wheel: { enabled: false },

            mode: 'xy',
            onZoomComplete: function (e) { applyZoomSync(e.chart); },
          },
          pan: { enabled: true, mode: 'xy', modifierKey: 'shift', onPanComplete: function (e) { applyZoomSync(e.chart); } },
        },
      },
      scales: {
        x: {
          ticks: { color: ct('xtick'), font: { size: 11 }, maxTicksLimit: 20 },

          ticks: { color: ct('xtick') },
          grid: { color: ct('grid') },

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function ivBaseName(n) { return String(n).replace(/\.[^.]+$/, ''); }

function decodeCsvBuffer(buf) {
  let text;
  try { text = new TextDecoder('utf-8').decode(buf); } catch(err) { text = ''; }
  if (text.indexOf('\uFFFD') !== -1) {
    try { text = new TextDecoder('big5').decode(buf); } catch(err) { /* keep utf8 */ }
  }
  return text.replace(/^\uFEFF/, '');
}

function guessIVCols(headers, numericCols) {
  function guess(re) {
    for (const c of numericCols) if (re.test(headers[c])) return c;
    return -1;
  }
  let xi = guess(/^i\b|^i\s*\(|電流|current|^i_|^i[a-z]*\s*\(/i);
  let yi = guess(/^v\b|^v\s*\(|電壓|voltage|^v_|^v[a-z]*\s*\(|stack/i);
  if (xi === -1) xi = numericCols[0];
  if (yi === -1 || yi === xi) { for (const c of numericCols) if (c !== xi) { yi = c; break; } }
  // 功率欄（選用）
  let pi = -1;
  for (const c of numericCols) {
    if (c === xi || c === yi) continue;
    if (/power|watt|瓦|功率|^p\s*\(/i.test(headers[c])) { pi = c; break; }
  }
  return { xi: xi, yi: yi, pi: pi };
}

function parseIVText(csvText, filename) {
  const rows = [];
  // 先切除前導檔頭（.fcd 等），分隔符也要依「切除後」的內容判斷
  const stripped = stripPreamble(csvText);
  const lines = stripped.split(/\r?\n/);
  const delim = detectDelim(stripped);
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const r = parseCSVLine(lines[i], delim);
    if (r && r.length) rows.push(r);
  }
  if (rows.length < 2) return null;
  const headers = rows[0].map(function(h) { return h.replace(/^['"]|['"]$/g, '').trim(); });
  const data = rows.slice(1);
  const sample = Math.min(20, data.length);
  const need = Math.max(5, Math.ceil(sample * 0.8));
  const numericCols = [];
  for (let c = 0; c < headers.length; c++) {
    let cnt = 0;
    for (let r = 0; r < sample; r++) if (isNumeric(data[r][c])) cnt++;
    if (cnt >= need) numericCols.push(c);
  }
  if (numericCols.length < 2) return null;
  const g = guessIVCols(headers, numericCols);
  return { name: ivBaseName(filename), headers: headers, numericCols: numericCols, data: data, xi: g.xi, yi: g.yi, pi: g.pi };
}

function readIVFile(file) {
  return new Promise(function(resolve) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      try { resolve(parseIVText(decodeCsvBuffer(new Uint8Array(evt.target.result)), file.name)); }
      catch(err) { resolve(null); }
    };
    reader.onerror = function() { resolve(null); };
    reader.readAsArrayBuffer(file);
  });
}

ivFileInput.addEventListener('change', async function(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  const room = IV_MAX - ivSeries.length;
  if (room <= 0) {
    ivFileName.textContent = '已達上限 ' + IV_MAX + ' 個檔案，請先移除部分曲線';
    e.target.value = '';
    return;
  }
  const take = files.slice(0, room);
  const skipped = files.length - take.length;
  const loaded = [];
  for (const f of take) loaded.push(await readIVFile(f));
  loaded.forEach(function(s) {
    if (!s) return;
    if (ivSeries.length >= IV_MAX) return;
    s.color = IV_COLORS[ivSeries.length % IV_COLORS.length];
    ivSeries.push(s);
  });
  const okN = loaded.filter(Boolean).length;
  const msg = '已載入 ' + okN + ' 個檔案（共 ' + ivSeries.length + '/' + IV_MAX + '）';
  ivFileName.textContent = msg + (skipped ? '，超出上限未載入 ' + skipped + ' 個' : '');
  e.target.value = '';
  // 第一次載入時沿用該檔的欄位判斷；之後依第一個檔案為準顯示
  if (okN && ivSel.xi === -1) {
    const first = loaded.find(Boolean);
    ivSel.xi = first.xi; ivSel.yi = first.yi;
  }
  renderIVChart();
});

function ivPointsOf(s, xi, yi) {
  const pts = [];
  const d = s.data;
  // 欄位超出此檔範圍 → 沒有可用的點
  if (xi >= s.headers.length || yi >= s.headers.length) return pts;
  for (let r = 0; r < d.length; r++) {
    const x = parseFloat(d[r][xi]);
    const y = parseFloat(d[r][yi]);
    if (isFinite(x) && isFinite(y)) pts.push({ x: x, y: y });
  }
  // 依 X 由小到大排序：資料可能是「定電流→掃描→回定電流」等非單調順序，
  // 不排序會讓 Chart.js（parsing:false）算錯 X 軸範圍
  pts.sort(function(a, b) { return a.x - b.x; });
  return pts;
}

function ivRefSeries() { return ivSeries[0] || null; }

// IV 散布圖：雙擊 X／Y 軸設定上下限與刻度間隔（右側功率軸也可）
function setupIVAxisEdit(chart, canvas) {
  canvas.addEventListener('dblclick', function(e) {
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Y 軸（含右側功率軸 yPow）
    const yIds = ['y', 'yPow'];
    for (let i = 0; i < yIds.length; i++) {
      const id = yIds[i];
      const sc = chart.scales[id];
      if (!sc) continue;
      if (sc.options && sc.options.display === false) continue;
      if (my >= ca.top - 6 && my <= ca.bottom + 6 && mx >= sc.left - 4 && mx <= sc.right + 4) {
        const opts = chart.options.scales[id];
        const title = (sc.options.title && sc.options.title.text) || (id === 'yPow' ? 'Power' : 'Y');
        const defLo = opts.min !== undefined ? opts.min : sc.min;
        const defHi = opts.max !== undefined ? opts.max : sc.max;
        const defStep = (opts.ticks && typeof opts.ticks.stepSize === 'number') ? opts.ticks.stepSize : '';
        askRange('✏️ 手動設定軸範圍 — ' + title, '起始值', defLo, '結束值', defHi, function(a, b, step) {
          const lo = parseFloat(a), hi = parseFloat(b);
          if (isNaN(lo) || isNaN(hi) || lo >= hi) { alert('請輸入有效數值（起始值需小於結束值）'); return; }
          opts.min = lo;
          opts.max = hi;
          applyAxisStep(opts, step);
          chart.update('none');
        }, defStep);
        return;
      }
    }

    // X 軸：圖表區下方
    if (mx >= ca.left && mx <= ca.right && my > ca.bottom && my <= ca.bottom + 40) {
      const opts = chart.options.scales.x;
      const sc = chart.scales.x;
      const defLo = opts.min !== undefined ? opts.min : sc.min;
      const defHi = opts.max !== undefined ? opts.max : sc.max;
      const defStep = (opts.ticks && typeof opts.ticks.stepSize === 'number') ? opts.ticks.stepSize : '';
      const xTitle = (sc.options.title && sc.options.title.text) || 'X';
      askRange('✏️ 手動設定軸範圍 — ' + xTitle, '起始值', defLo, '結束值', defHi, function(a, b, step) {
        const lo = parseFloat(a), hi = parseFloat(b);
        if (isNaN(lo) || isNaN(hi) || lo >= hi) { alert('請輸入有效數值（起始值需小於結束值）'); return; }
        opts.min = lo;
        opts.max = hi;
        applyAxisStep(opts, step);
        chart.update('none');
      }, defStep);
    }
  });
}

// 階梯取樣：只保留「定電流平台」（同一電流連續取樣多筆）的最後一筆電壓，
// 也就是電流改變前的那一筆；平台之間的過渡爬升點不畫，避免畫出垂直震盪線段。
function ivStepFilter(pts) {
  if (!ivSel.stepFilter || !pts.length) return pts;
  const tol = ivSel.stepTol;
  const groups = [];
  let g = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (Math.abs(pts[i].x - g[0].x) <= tol) g.push(pts[i]);
    else { groups.push(g); g = [pts[i]]; }
  }
  groups.push(g);
  // 「定電流平台」= 同一電流連續取樣很多筆；門檻隨資料量自動調整
  const minRun = Math.max(3, Math.ceil(pts.length * 0.005));
  // 只有當「重複取樣的平台點」占絕大多數（≥80%）時，才視為階梯資料而只留平台末筆。
  // 否則（例如少量取樣、含真正掃描段的資料）保留全部點，避免把曲線丟掉。
  let longPts = 0;
  groups.forEach(function(gr) { if (gr.length >= minRun) longPts += gr.length; });
  if (longPts < pts.length * 0.8) return pts;
  const kept = groups.filter(function(gr) { return gr.length >= minRun; })
                    .map(function(gr) { return gr[gr.length - 1]; });
  if (kept.length < 2) return pts;
  return kept;
}

function ivPowerPoints(s, xi) {
  if (s.pi === undefined || s.pi === -1) return null;
  const pts = [];
  const d = s.data;
  if (xi >= s.headers.length || s.pi >= s.headers.length) return null;
  for (let r = 0; r < d.length; r++) {
    const x = parseFloat(d[r][xi]);
    const y = parseFloat(d[r][s.pi]);
    if (isFinite(x) && isFinite(y)) pts.push({ x: x, y: y });
  }
  if (!pts.length) return null;
  pts.sort(function(a, b) { return a.x - b.x; });
  return pts;
}

// 沒有 Power 欄時，用 P = I × V 計算功率（與已畫出的 IV 點一致）
function ivPowerFromIV(ivPts) {
  if (!ivPts || !ivPts.length) return null;
  const pts = [];
  for (let i = 0; i < ivPts.length; i++) pts.push({ x: ivPts[i].x, y: ivPts[i].x * ivPts[i].y });
  return pts;
}
function ivHasPowerCol(s) { return !(s.pi === undefined || s.pi === -1 || s.pi >= s.headers.length); }
function ivPowerTitle() {
  const ref = ivRefSeries();
  if (ref && ivHasPowerCol(ref)) return ref.headers[ref.pi] || 'Power (Watts)';
  return 'Power (W) = I × V（計算值）';
}

// 各檔案用「自己的」X/Y 欄位（欄位數不同的檔案也能正確疊圖）
function ivColsOf(s) { return { xi: s.xi, yi: s.yi }; }

// 使用者切換欄位時：先依欄名比對套用到各檔案，其次才用相同索引
function ivApplyCols(nx, ny) {
  const ref = ivRefSeries();
  if (!ref) return;
  const norm = function(v) { return String(v || '').trim().toLowerCase(); };
  const xName = norm(ref.headers[nx]);
  const yName = norm(ref.headers[ny]);
  ivSeries.forEach(function(s) {
    if (nx >= 0 && nx !== s.xi) {
      if (s.xi === nx) return;
      let found = -1;
      for (let c = 0; c < s.headers.length; c++) {
        if (norm(s.headers[c]) === xName) { found = c; break; }
      }
      s.xi = (found !== -1) ? found : (nx < s.headers.length ? nx : s.xi);
    }
    if (ny >= 0 && ny !== s.yi) {
      if (s.yi === ny) return;
      let found = -1;
      for (let c = 0; c < s.headers.length; c++) {
        if (norm(s.headers[c]) === yName) { found = c; break; }
      }
      s.yi = (found !== -1) ? found : (ny < s.headers.length ? ny : s.yi);
    }
  });
}

// 依目前選用狀況組出所有 dataset（IV 曲線 + 功率曲線）
function ivBuildDatasets() {
  const list = [];
  const ivDataMap = [];
  ivSeries.forEach(function(s) {
    const c = ivColsOf(s);
    const pts = ivStepFilter(ivPointsOf(s, c.xi, c.yi));
    ivDataMap.push(pts);
    list.push({
      _kind: 'iv',
      label: s.name,
      data: pts,
      parsing: false,
      showLine: ivSel.showLine,
      borderColor: s.color,
      backgroundColor: s.color,
      borderWidth: ivSel.showLine ? 2 : 0,
      tension: ivSel.tension,
      pointRadius: ivSel.showPts ? 2.5 : 0,
      pointHoverRadius: 4,
      pointBackgroundColor: s.color,
      fill: false,
    });
  });
  if (ivSel.showPower) {
    ivSeries.forEach(function(s, i) {
      const c = ivColsOf(s);
      let p, tag;
      if (ivHasPowerCol(s)) { p = ivStepFilter(ivPowerPoints(s, c.xi)); tag = ' 功率'; }
      else { p = ivPowerFromIV(ivDataMap[i]); tag = ' 功率（計算 I×V）'; }
      if (!p) return;
      list.push({
        _kind: 'power',
        label: s.name + tag,
        data: p,
        parsing: false,
        showLine: true,
        borderColor: s.color,
        backgroundColor: s.color,
        borderWidth: 1.6,
        borderDash: [6, 3],
        tension: ivSel.tension,
        pointRadius: ivSel.showPts ? 2 : 0,
        pointHoverRadius: 4,
        pointBackgroundColor: s.color,
        fill: false,
        yAxisID: 'yPow',
      });
    });
  }
  return list;
}

  const ref = ivRefSeries();

  const reader = new FileReader();
  reader.onload = function(evt) { parseAndBuild(evt.target.result, file.name); };
  reader.onerror = function() { loading.style.display = 'none'; };
  // UTF-8 BOM → UTF-8；否則先試 Big5，若出現無法解碼的字元則改用 UTF-8
  reader.readAsArrayBuffer(file);
  reader.onload = function(evt) {
    const buf = new Uint8Array(evt.target.result);
    let text = null;
    if (buf.length >= 3 && buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF) {
      text = new TextDecoder('utf-8').decode(buf);
    } else {
      try { text = new TextDecoder('big5').decode(buf); } catch (err) { text = null; }
      if (text === null || text.indexOf('\uFFFD') !== -1) {
        try { text = new TextDecoder('utf-8').decode(buf); } catch (err) { text = ''; }
      }
    }
    const clean = text.replace(/^\uFEFF/, '');
    // 單檔 → 原本流程；多檔 → 疊圖比較
    if (multiBatch.length <= 1) {
      parseAndBuild(clean, file.name);
    } else {
      loadMultiFiles(multiBatch);
    }
  };
});

// 解析資料表 → { headers, numericCols, times, series, labels, timeCol, xIsTime }
function analyzeTable(csvText) {
  try {
    // 先切除前導檔頭（.fcd 等），分隔符也要依「切除後」的內容判斷
    const stripped = stripPreamble(csvText);
    const lines = stripped.trim().split('\n');
    if (lines.length < 2) { loading.style.display = 'none'; return; }
    const delim = detectDelim(stripped);

    const rawHeaders = parseCSVLine(lines[0], delim);
    const headers = rawHeaders.map(h => {
      let s = h.replace(/^['"]|['"]$/g, '').trim().replace(/^\uFEFF/, '');
      if (s.includes('ime (Sec)')) s = s.replace(/^.*ime/, 'Time');
      s = s.replace(/^[^\w\(]+/, '').trim();
      return s || h.trim();
    });

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCSVLine(lines[i], delim);
      if (cols.length < 2) continue;
      rows.push(cols.map(c => {
        c = c.replace(/^['"]|['"]$/g, '').trim();
        return c;
      }));
    }
    if (rows.length < 2) { loading.style.display = 'none'; return; }

    let timeCol = -1;
    const timeKeywords = ['time', 'date', 'datetime', 'timestamp', '時間', '日期', '日付'];
    for (let c = 0; c < headers.length; c++) {
      const hl = headers[c].toLowerCase();
      if (timeKeywords.some(kw => hl.includes(kw))) {
        let parsed = 0;
        for (let r = 0; r < Math.min(5, rows.length); r++) {
          if (parseTime(rows[r][c])) parsed++;
        }
        if (parsed >= 3) { timeCol = c; break; }
      }
    }
    if (timeCol < 0) {
      let parsed = 0;
      for (let r = 0; r < Math.min(5, rows.length); r++) {
        if (parseTime(rows[r][0])) parsed++;
      }
      if (parsed >= 3) timeCol = 0;
    }

    const numericCols = [];
    for (let c = 0; c < headers.length; c++) {
      if (c === timeCol) continue;
      let numCount = 0;
      for (let r = 0; r < Math.min(10, rows.length); r++) {
        if (isNumeric(rows[r][c])) numCount++;
      }
      if (numCount >= 8) numericCols.push(c);
    }
    // 若無日期欄，檢查 A 欄是否為數值流水號（如 sec），改以 A 欄作為 X 軸
    let xCol = timeCol;
    let xIsTime = timeCol >= 0;
    if (timeCol < 0) {
      let cnt0 = 0;
      for (let r = 0; r < Math.min(10, rows.length); r++) if (isNumeric(rows[r][0])) cnt0++;
      if (cnt0 >= 8) {
        xCol = 0;
        xIsTime = false;
        headers[0] = headers[0].replace(/^\uFEFF/, '').replace(/^[^\x20-\x7E\u4e00-\u9fa5\(]+/, '').trim() || headers[0].trim();
        const p = numericCols.indexOf(0);
        if (p !== -1) numericCols.splice(p, 1);
      } else {
        xCol = -1;
        xIsTime = false;
      }
    }
    if (numericCols.length === 0) { loading.style.display = 'none'; return; }

    const times = [];
    const series = {};
    for (const c of numericCols) series[c] = [];

    for (let r = 0; r < rows.length; r++) {
      let t;
      if (xIsTime) {
        t = parseTime(rows[r][xCol]);
        if (!t || isNaN(t.getTime())) continue;
      } else if (xCol >= 0) {
        const v = rows[r][xCol];
        t = isNumeric(v) ? parseFloat(v) : null;
        if (t === null) continue;
      } else {
        t = r;
      }
      times.push(t);
      for (const c of numericCols) {
        series[c].push(isNumeric(rows[r][c]) ? parseFloat(rows[r][c]) : 0);
      }
    }
    if (times.length < 2) { loading.style.display = 'none'; return; }

    const labels = xIsTime ? times.map(d => fmtTimeShort(d)) : times.map(v => String(v));
    if (xCol >= 0) headers[xCol] = headers[xCol].replace(/^\uFEFF/, '').replace(/^[^\w\(]+/, '').trim() || headers[xCol].trim();
    return { headers: headers, numericCols: numericCols, times: times, series: series, labels: labels, timeCol: xCol, xIsTime: xIsTime };
  } catch (e) { return null; }
}

function calcSlope(dataArr, chart) {
  const xs = chart.scales.x;
  if (!xs) return null;
  const optMin = chart.options.scales.x.min;
  const optMax = chart.options.scales.x.max;
  const xMin = optMin !== undefined ? Math.round(optMin) : 0;
  const xMax = optMax !== undefined ? Math.round(optMax) : dataArr.length - 1;
  if (xMin >= xMax || xMin < 0 || xMax >= dataArr.length) return null;
  const d = dataArr.slice(xMin, xMax + 1);
  const n = d.length;
  if (n < 3) return null;
  let sx = 0, sy = 0, sxy = 0, sx2 = 0;
  for (let i = 0; i < n; i++) { sx += i; sy += d[i]; sxy += i * d[i]; sx2 += i * i; }
  const m = (n * sxy - sx * sy) / (n * sx2 - sx * sx);
  const b = (sy - m * sx) / n;
  const my = sy / n;
  let ssr = 0, sst = 0;
  for (let i = 0; i < n; i++) { ssr += (d[i] - (m * i + b)) ** 2; sst += (d[i] - my) ** 2; }
  const r2 = sst > 0 ? 1 - ssr / sst : 0;
  return { m, b, r2, n, xMin };
}

// Simple CSV line parser (handles quoted fields)
function parseCSVLine(line, delim) {
  const d = delim || ',';
  const result = [];
  let current = '';
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuote = !inQuote;
    } else if (ch === d && !inQuote) {
      result.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

// 自動判斷分隔符：Tab / 逗號 / 分號 / 連續空白
// 某些儀器檔（如 FuelCell .fcd）開頭有大量檔頭說明，
// 真正的欄位標題列從 'Time (Sec)' 開始 → 先切除前導檔頭與 'End Comments' 標記
function stripPreamble(text) {
  let lines = String(text).split(/\r?\n/);
  const start = lines.findIndex(function(l) { return /(^|[\t,;]|\s)\s*Time\s*\(Sec\)/i.test(l); });
  if (start > 0) lines = lines.slice(start);
  lines = lines.filter(function(l) { return !/^\s*End\s+Comments\s*$/i.test(l); });
  return lines.join('\n');
}

function detectDelim(text) {
  const lines = String(text).split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (!l.trim()) continue;
    const tabs = (l.match(/\t/g) || []).length;
    const commas = (l.match(/,/g) || []).length;
    const semis = (l.match(/;/g) || []).length;
    if (tabs >= commas && tabs >= semis && tabs > 0) return '\t';
    if (commas >= semis && commas > 0) return ',';
    if (semis > 0) return ';';
    // 整列以空白分隔（例如用空格對齊的儀器輸出）
    if (/^\s*\S+(\s{2,}\S+)+\s*$/.test(l)) return /(\s{2,})/.exec(l)[1];
    return ',';   // 單欄資料（如流水號 A 欄）
  }
  return ',';
}

function buildCharts(times, series, labels, numericCols, headers, timeCol) {

  // Stats
  const r2 = v => Math.round(v * 100) / 100;
  const st = (arr) => {
    if (arr.length === 0) return { min: 0, max: 0, avg: 0 };
    return { min: r2(Math.min(...arr)), max: r2(Math.max(...arr)), avg: r2(arr.reduce((a,b) => a+b, 0) / arr.length) };

          let maxW = 0;
          const spans = cfgDiv.querySelectorAll('span');
          spans.forEach(function(sp) { maxW = Math.max(maxW, sp.scrollWidth); });
          spans.forEach(function(sp) { sp.style.width = maxW + 'px'; });
        }
      };
      c.querySelector('.zoom-hint').appendChild(toggleBtn);
      c.appendChild(cfgDiv);
      // 同單位分組（不分大小寫，依最末單位如 kPa / NLPM / 度）
      const yGroups = {};
      const yGroupOrder = [];
      numericCols.forEach(function(col, i) {
        const key = getUnitKey(headers[col]);
        const norm = key.toLowerCase();
        if (!(norm in yGroups)) { yGroups[norm] = { label: key, items: [] }; yGroupOrder.push(norm); }
        yGroups[norm].items.push({ col: col, idx: i });
      });
      const ySorted = [];
      yGroupOrder.forEach(function(norm) { yGroups[norm].items.forEach(function(it) { ySorted.push(it); }); });
      ySorted.forEach(function(entry) {
        const col = entry.col, i = entry.idx;
        const axisId = 'y' + i;
        const sideColor = i % 2 === 0 ? '#ff9f0a' : '#0a84ff';
        const row = document.createElement('div');
        row.style.cssText = 'margin:4px 0;white-space:nowrap;break-inside:avoid';
        row.innerHTML = '<input type="checkbox" id="ySyncChk_' + i + '" title="勾選後與其他已勾選的數列連動範圍" style="margin-right:6px;vertical-align:middle">'
          + '<span style="color:' + sideColor + ';font-size:11px;display:inline-block;white-space:nowrap;vertical-align:middle;margin-right:6px">' + headers[col] + '</span>'
          + '<input type="number" step="any" id="ymin_' + i + '" placeholder="最小" style="width:80px;background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px;margin-right:6px">'
          + '<input type="number" step="any" id="ymax_' + i + '" placeholder="最大" style="width:80px;background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px">';
        cfgDiv.appendChild(row);
      });
      // 連動：已勾選的數列，最小值/最大值輸入會同步
      (function() {
        let ySyncing = false;
        function syncYInputs(srcIdx, type) {
          if (ySyncing) return;
          const srcChk = document.getElementById('ySyncChk_' + srcIdx);
          if (!srcChk || !srcChk.checked) return;
          const srcVal = document.getElementById(type === 'min' ? 'ymin_' + srcIdx : 'ymax_' + srcIdx).value;
          ySyncing = true;
          numericCols.forEach(function(_, j) {
            if (j === srcIdx) return;
            const chk = document.getElementById('ySyncChk_' + j);
            if (chk && chk.checked) {
              document.getElementById(type === 'min' ? 'ymin_' + j : 'ymax_' + j).value = srcVal;
            }
          });
          ySyncing = false;
        }
        numericCols.forEach(function(_, i) {
          document.getElementById('ymin_' + i).addEventListener('input', function() { syncYInputs(i, 'min'); });
          document.getElementById('ymax_' + i).addEventListener('input', function() { syncYInputs(i, 'max'); });
          document.getElementById('ySyncChk_' + i).addEventListener('change', function() {
            if (!this.checked) return;
            let srcMin = null, srcMax = null;
            for (let k = 0; k < numericCols.length; k++) {
              if (k === i) continue;
              const c = document.getElementById('ySyncChk_' + k);
              if (c && c.checked) {
                const vMin = document.getElementById('ymin_' + k).value;
                const vMax = document.getElementById('ymax_' + k).value;
                if (vMin !== '') srcMin = vMin;
                if (vMax !== '') srcMax = vMax;
                if (srcMin !== null || srcMax !== null) break;
              }
            }
            if (srcMin !== null) document.getElementById('ymin_' + i).value = srcMin;
            if (srcMax !== null) document.getElementById('ymax_' + i).value = srcMax;
          });
        });
      })();
      const applyBtn = document.createElement('button');
      applyBtn.textContent = '套用';
      applyBtn.style.cssText = 'background:var(--btn-bg);color:var(--text);border:1px solid var(--accent);padding:4px 16px;border-radius:4px;cursor:pointer;font-size:11px;margin-top:6px';
      applyBtn.onclick = function() {
        numericCols.forEach((col, i) => {
          const mn = document.getElementById('ymin_' + i).value;
          const mx = document.getElementById('ymax_' + i).value;
          const s = chart.options.scales['y' + i];
          if (mn !== '') s.min = parseFloat(mn); else delete s.min;
          if (mx !== '') s.max = parseFloat(mx); else delete s.max;
        });
        chart.update();
      };
      cfgDiv.appendChild(applyBtn);

      // Threshold config for combined chart
      const thDiv = document.createElement('div');
      thDiv.style.cssText = 'margin-top:6px;display:none';
      const thToggle = document.createElement('button');
      thToggle.textContent = '🔴 上下限警示';
      thToggle.style.cssText = 'background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-border);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;margin-left:8px';
      thToggle.onclick = function() { thDiv.style.display = thDiv.style.display === 'none' ? 'block' : 'none'; };
      c.querySelector('.zoom-hint').appendChild(thToggle);
      c.appendChild(thDiv);
      numericCols.forEach((col, i) => {
        const sideColor = i % 2 === 0 ? '#ff9f0a' : '#0a84ff';
        const row = document.createElement('div');
        row.style.cssText = 'margin:4px 0';
        row.innerHTML = '<span style="color:' + sideColor + ';font-size:11px;display:inline-block;width:110px">' + headers[col] + '</span>'
          + '<input type="number" step="any" id="allThLo_' + i + '" placeholder="下限" style="width:80px;background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px;margin-right:6px">'
          + '<input type="number" step="any" id="allThHi_' + i + '" placeholder="上限" style="width:80px;background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px;margin-right:6px">'
          + '<button class="allThApply" data-i="' + i + '" style="background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border);padding:2px 12px;border-radius:3px;cursor:pointer;font-size:11px;margin-right:4px">套用</button>'
          + '<button class="allThReset" data-i="' + i + '" style="background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-border);padding:2px 12px;border-radius:3px;cursor:pointer;font-size:11px">歸零</button>';
        thDiv.appendChild(row);
      });
      thDiv.addEventListener('click', function(e) {
        const target = e.target;
        const i = target.getAttribute('data-i');
        if (i === null) return;
        if (target.classList.contains('allThApply')) {
          const lo = document.getElementById('allThLo_' + i).value;
          const hi = document.getElementById('allThHi_' + i).value;
          chart['_thLo_' + i] = lo !== '' ? parseFloat(lo) : undefined;
          chart['_thHi_' + i] = hi !== '' ? parseFloat(hi) : undefined;
          chart.update();
        } else if (target.classList.contains('allThReset')) {
          document.getElementById('allThLo_' + i).value = '';
          document.getElementById('allThHi_' + i).value = '';
          chart['_thLo_' + i] = undefined;
          chart['_thHi_' + i] = undefined;
          chart.update();
        }
      });

      // 壓差曲線
      let diffCount = 0;
      const diffDiv = document.createElement('div');
      diffDiv.style.cssText = 'margin-top:6px;display:none';
      const diffToggle = document.createElement('button');
      diffToggle.textContent = '📊 壓差曲線';
      diffToggle.style.cssText = 'background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-border);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;margin-left:8px';
      diffToggle.onclick = function() { diffDiv.style.display = diffDiv.style.display === 'none' ? 'block' : 'none'; };
      c.querySelector('.zoom-hint').appendChild(diffToggle);
      c.appendChild(diffDiv);
      diffDiv.innerHTML = '<div style="margin:4px 0;font-size:12px;color:var(--stat)">選擇兩個欄位計算壓差（絕對值相減）</div>'
        + '<div style="margin:4px 0"><select id="diffSelA" style="background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px;margin-right:10px">'
        + numericCols.map((col, i) => '<option value="' + i + '">' + headers[col] + '</option>').join('')
        + '</select><span style="color:var(--stat);font-size:11px"> ➖ </span>'
        + '<select id="diffSelB" style="background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px;margin-left:10px;margin-right:12px">'
        + numericCols.map((col, i) => '<option value="' + i + '">' + headers[col] + '</option>').join('')
        + '</select>'
        + '<button id="diffConfirm" style="background:var(--btn-bg);color:var(--text);border:1px solid var(--accent);padding:2px 14px;border-radius:3px;cursor:pointer;font-size:11px">確認新增</button>'
        + '</div>';
      document.getElementById('diffConfirm').addEventListener('click', function() {
        const ia = parseInt(document.getElementById('diffSelA').value);
        const ib = parseInt(document.getElementById('diffSelB').value);
        if (ia === ib) { /* same column, skip */ return; }
        const colA = numericCols[ia], colB = numericCols[ib];
        const diffData = series[colA].map((v, i) => Math.abs(v - series[colB][i]));
        const label = '壓差: ' + headers[colA] + ' - ' + headers[colB];
        const diffAxisId = 'yDiff' + diffCount;
        const diffSide = (numericCols.length + diffCount) % 2 === 0 ? 'left' : 'right';
        const diffColor = isLightTheme() ? '#374151' : '#ffffff';
        diffCount++;
        chart.data.datasets.push({
          label: label,
          data: diffData,
          borderColor: diffColor,
          borderWidth: 2,
          borderDash: [4, 2],
          pointRadius: 0,
          tension: 0.1,
          yAxisID: diffAxisId,
        });
        chart.options.scales[diffAxisId] = {
          type: 'linear', display: true, position: diffSide,
          title: { display: true, text: label, color: diffColor },
          ticks: { color: diffColor },
          grid: { drawOnChartArea: false },
        };
        chart.update();
        diffDiv.style.display = 'none';
      });
    } catch(e) { /**/ }
  })();

  // Helpers for individual charts reordering / deletion (拖曳由 Sortable.js 處理)
  let curIndPage = 0;
  let showIndividualPage = null;
  function reflowIndividualPages(focusId) {
    const containers = [];
    pages.forEach(function(p) { Array.from(p.children).forEach(function(el) { if (el.classList.contains('chart-container')) containers.push(el); }); });
    let focusIdx = -1;
    if (focusId) {
      for (let k = 0; k < containers.length; k++) {
        const cv = containers[k].querySelector('canvas');
        if (cv && cv.id === focusId) { focusIdx = k; break; }
      }
    }
    pages.forEach(function(p) { p.remove(); });
    pages.length = 0;
    let curPage = null;
    containers.forEach(function(cEl, idx) {
      if (idx % perPage === 0) {
        curPage = document.createElement('div');
        curPage.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;align-items:start';
        indWrap.appendChild(curPage);
        pages.push(curPage);
      }
      curPage.appendChild(cEl);
      const ch = cEl.querySelector('canvas') ? Chart.getChart(cEl.querySelector('canvas').id) : null;
      if (ch) { try { ch.resize(); } catch(e) {} }
    });
    const nav = document.getElementById('indNav');
    if (nav) {
      if (pages.length <= 1) nav.style.display = 'none';
      else {
        nav.style.display = '';
        let showIdx = curIndPage;
        if (focusIdx >= 0) showIdx = Math.floor(focusIdx / perPage);
        showIdx = Math.max(0, Math.min(showIdx, pages.length - 1));
        if (showIndividualPage) showIndividualPage(showIdx);
        else {
          pages.forEach(function(p, pi) { p.style.display = pi === showIdx ? 'grid' : 'none'; });
          const info = document.getElementById('indPageInfo');
          if (info) info.textContent = '第 ' + (showIdx + 1) + ' / ' + pages.length + ' 頁';
          const prev = document.getElementById('indPrev'), next = document.getElementById('indNext');
          if (prev) prev.disabled = showIdx === 0;
          if (next) next.disabled = showIdx >= pages.length - 1;
          curIndPage = showIdx;
        }
      }
    }
  }
  function deleteIndividualChart(id) {
    const ch = Chart.getChart(id);
    if (ch) { const idx = allCharts.indexOf(ch); if (idx >= 0) allCharts.splice(idx, 1); try { ch.destroy(); } catch(e) {} }
    const cEl = document.getElementById(id) ? document.getElementById(id).closest('.chart-container') : null;
    if (cEl) cEl.remove();
    reflowIndividualPages();
  }
  // 關閉選單（點空白處）
  if (!window._chartMenuDocBound) {
    window._chartMenuDocBound = true;
    document.addEventListener('click', function() { document.querySelectorAll('.chart-menu').forEach(function(m) { m.style.display = 'none'; }); });
  }

  // Individual charts — arranged in a 2×2 grid, 4 per screen (page)
  function makeChart(id, title, dataArr, unit, color, parent, colIdx) {
    const c = document.createElement('div');
    c.className = 'chart-container';
    c.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="display:flex;align-items:center;gap:6px"><span class="drag-handle" title="拖曳排序">⠿</span><h3 style="margin-bottom:0">' + title + '</h3></div><div class="chart-menu-wrap" style="position:relative"><button class="chart-menu-btn" title="更多選項">⋯</button><div class="chart-menu"><div class="chart-menu-item danger" data-action="delete">🗑️ 刪除</div></div></div></div><div class="chart-wrap" style="height:34vh;min-height:180px"><canvas id="' + id + '"></canvas></div><div class="zoom-hint">🖱️ 拖曳框選縮放 XY（需拖>10px） · Shift+拖曳平移<button onclick="resetChart(\'' + id + '\')">↺ 重設</button></div>';
    // Threshold inputs below chart
    c.innerHTML += '<div class="thresh-row" style="text-align:center;margin-top:6px;font-size:12px;color:var(--stat)">'
      + '下限: <input type="number" step="any" id="thLo_' + id + '" placeholder="無" style="width:80px;background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px;margin-right:12px">'
      + '上限: <input type="number" step="any" id="thHi_' + id + '" placeholder="無" style="width:80px;background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px;margin-right:8px">'
      + '<button class="thApply" style="background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border);padding:2px 12px;border-radius:3px;cursor:pointer;font-size:11px;margin-right:6px">套用</button>'
      + '<button class="thReset" style="background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-border);padding:2px 12px;border-radius:3px;cursor:pointer;font-size:11px">歸零</button>'
      + '</div>';
    parent.appendChild(c);
    // 選單（僅刪除，拖曳由 Sortable.js 處理）
    (function() {
      const menuBtn = c.querySelector('.chart-menu-btn');
      const menu = c.querySelector('.chart-menu');
      if (!menuBtn || !menu) return;
      menuBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const isOpen = menu.style.display === 'block';
        document.querySelectorAll('.chart-menu').forEach(function(m) { m.style.display = 'none'; });
        menu.style.display = isOpen ? 'none' : 'block';
      });
      const delBtn = menu.querySelector('[data-action="delete"]');
      if (delBtn) delBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        menu.style.display = 'none';
        deleteIndividualChart(id);
      });
    })();
    const canvas = document.getElementById(id);

    try {
      const chart = new Chart(canvas, {
        type: 'line',
        data: { labels, datasets: [{
          label: title,
          data: dataArr,
          borderColor: color,
          backgroundColor: color + '33',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.1,
          fill: false,
          segment: {
            borderColor: function(ctx) {
              const lo = ctx.chart._thLo, hi = ctx.chart._thHi;
              if (lo === undefined || hi === undefined) return color;
              const y0 = ctx.p0.parsed.y, y1 = ctx.p1.parsed.y;
              if (y0 < lo || y1 < lo || y0 > hi || y1 > hi) return '#ff453a';
              return color;
            },
            borderWidth: function(ctx) {
              const lo = ctx.chart._thLo, hi = ctx.chart._thHi;
              if (lo === undefined || hi === undefined) return 2;
              const y0 = ctx.p0.parsed.y, y1 = ctx.p1.parsed.y;
              if (y0 < lo || y1 < lo || y0 > hi || y1 > hi) return 3;
              return 2;
            },
          },
        }]},
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'nearest', axis: 'x', intersect: false },
          plugins: {
            legend: { labels: { color: ct('legend'), font: { size: 11 } } },
            tooltip: {
              backgroundColor: 'rgba(28,28,30,0.94)', titleColor: '#0a84ff', bodyColor: '#f5f5f7',
              borderColor: 'rgba(255,255,255,0.14)', borderWidth: 1,
            },
            zoom: {
              zoom: {
                wheel: { enabled: false },
                drag: { enabled: true, threshold: 10, backgroundColor: 'rgba(10,132,255,0.12)', borderColor: '#0a84ff', borderWidth: 1.5 },
                mode: 'xy',
                onZoomComplete: function(e) { applyZoomSync(e.chart); },
              },
              pan: { enabled: true, mode: 'xy', modifierKey: 'shift', onPanComplete: function(e) { applyZoomSync(e.chart); } },
            },
          },
          scales: {
            x: {
              ticks: { color: ct('xtick'), font: { size: 11 }, maxTicksLimit: 20 },
              grid: { color: ct('grid') },
              title: { display: true, text: timeCol >= 0 ? (times[0] instanceof Date ? '時間' : headers[timeCol]) : '索引', color: ct('axisTitle') },
            },
            y: {
              display: true,
              title: { display: true, text: unit, color: color },
              ticks: { color: color },
              grid: { color: ct('grid') },
            },
          },
        },
      });
      setupCrosshair(chart, canvas, labels);
      setupPlotline(chart, canvas, labels, [colIdx]);
      setupAxisEdit(chart, canvas, labels, times, timeCol);
      allCharts.push(chart);
      if (plotlineEnabled) syncZoomEnabledByPlotline();

      const hintDiv = c.querySelector('.zoom-hint');
      const slopeBtn = document.createElement('button');
      slopeBtn.textContent = '📈 斜率';
      slopeBtn.style.cssText = 'background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-border);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;margin-left:8px';
      const resultDiv = document.createElement('div');
      resultDiv.setAttribute('data-role', 'slope-result');
      resultDiv.style.cssText = 'text-align:center;color:var(--result-fg);font-size:12px;margin-top:4px;min-height:18px';
      c.appendChild(resultDiv);
      slopeBtn.onclick = function() {
        const r = calcSlope(dataArr, chart);
        if (!r) { resultDiv.textContent = '請先拖曳縮放選擇範圍'; return; }
        const regData = new Array(labels.length).fill(null);
        for (let i = r.xMin; i < r.xMin + r.n; i++) regData[i] = r.m * (i - r.xMin) + r.b;
        const ri = chart.data.datasets.findIndex(d => d._reg);
        if (ri >= 0) chart.data.datasets.splice(ri, 1);
        chart.data.datasets.push({
          _reg: true, label: '迴歸 (斜率=' + r.m.toFixed(4) + ')', data: regData,
          borderColor: '#ff0000', borderWidth: 2, borderDash: [6,3], pointRadius: 0, fill: false,
          yAxisID: chart.data.datasets[0].yAxisID || 'y',
        });
        chart.update();
        resultDiv.textContent = '斜率 = ' + r.m.toFixed(4) + '  截距 = ' + r.b.toFixed(2) + '  R² = ' + r.r2.toFixed(4) + '  (n=' + r.n + ')';
      };
      hintDiv.appendChild(slopeBtn);

      // Threshold apply/reset handlers
      c.querySelector('.thApply').addEventListener('click', function() {
        const loVal = document.getElementById('thLo_' + id).value;
        const hiVal = document.getElementById('thHi_' + id).value;
        chart._thLo = loVal !== '' ? parseFloat(loVal) : undefined;
        chart._thHi = hiVal !== '' ? parseFloat(hiVal) : undefined;
        chart.update();
      });
      c.querySelector('.thReset').addEventListener('click', function() {
        document.getElementById('thLo_' + id).value = '';
        document.getElementById('thHi_' + id).value = '';
        chart._thLo = undefined;
        chart._thHi = undefined;
        chart.update();
      });
    } catch(e) { /**/ }
  }

  const indWrap = document.createElement('div');
  indWrap.style.cssText = 'margin-bottom:20px';
  chartsDiv.appendChild(indWrap);
  const indGrid = document.createElement('div');
  indGrid.id = 'indGrid';
  indGrid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;align-items:start';
  indWrap.appendChild(indGrid);
  const perPage = 9999;
  const pages = [indGrid];
  numericCols.forEach((col, i) => {
    const colName = headers[col];
    makeChart('ch' + i, colName, series[col], colName, colors[i % colors.length], indGrid, i);
  });
  // Sortable.js 平滑拖曳排序（加速自動捲動）
  if (typeof Sortable !== 'undefined' && indGrid) {
    new Sortable(indGrid, {
      animation: 200,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      dragClass: 'sortable-drag',
      handle: '.drag-handle',
      scroll: true,
      scrollSensitivity: 100,
      scrollSpeed: 35,
      bubbleScroll: true,
      onEnd: function() {
        indGrid.querySelectorAll('canvas').forEach(function(cv) {
          const ch = Chart.getChart(cv.id);
          if (ch) try { ch.resize(); } catch(e) {}
        });
      }
    });
  }
}


</script>
</body>
</html>
