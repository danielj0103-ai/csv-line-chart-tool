<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {

  --page-bg:#000000; --text:#f5f5f7;
  --panel:#1c1c1e; --panel-deep:#2c2c2e;

  --hairline:rgba(255,255,255,0.12);

  --danger:#ff453a;
}
body.light {
  /* 淺色：systemGroupedBackground + 白卡片 */
  --page-bg:#f2f2f7; --text:#1d1d1f;
  --panel:#ffffff; --panel-deep:#f2f2f7;
  --file-bg:#0071e3; --file-hover:#0077ed; --file-fg:#ffffff;
  --btn-bg:#f2f2f7; --btn-fg:#1d1d1f; --btn-border:rgba(0,0,0,0.08);
  --btn-hover:#e5e5ea; --btn-hover-fg:#000000;
  --input-bg:#ffffff; --input-fg:#1d1d1f; --input-border:rgba(0,0,0,0.16);
  --accent:#0071e3;
  --muted:rgba(60,60,67,0.6); --stat:rgba(60,60,67,0.75);
  --dim:rgba(60,60,67,0.4); --tick:rgba(60,60,67,0.85);
  --out-bg:#f2f2f7; --result-fg:#1d1d1f;
  --hairline:rgba(0,0,0,0.08);
  --shadow:0 1px 2px rgba(0,0,0,0.04), 0 8px 28px rgba(0,0,0,0.06);
  --danger:#d70015;
}
body {
  background:var(--page-bg); color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
              "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-0.01em;
  padding:36px 20px 64px;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
::selection { background:var(--accent); color:#fff; }

/* 內容置中，維持閱讀寬度（只作用在最外層容器，不影響 grid 內的個別圖） */
.controls, #columnConfig, #loading, .stats, #charts, #multiCharts, #ivCharts {
  max-width:1440px; margin-left:auto; margin-right:auto;
}

h1 { text-align:center; margin-bottom:28px; color:var(--text); font-size:34px; font-weight:700; letter-spacing:-0.025em; }
.subtitle { text-align:center; color:var(--muted); font-size:14px; font-weight:400; margin-bottom:28px; letter-spacing:0; }

/* 藥丸按鈕 + focus ring */
.controls { text-align:center; margin-bottom:28px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; }
.controls label {
  background:var(--file-bg); color:var(--file-fg);
  padding:11px 22px; border-radius:980px; cursor:pointer; display:inline-block;
  font-size:14px; font-weight:590; letter-spacing:-0.01em; user-select:none;
  box-shadow:0 1px 2px rgba(0,0,0,0.12);
  transition:transform .18s cubic-bezier(.25,.8,.25,1), filter .18s;
}
.controls label:hover { filter:brightness(1.08); }
.controls label:active { transform:scale(.97); }
.controls input { display:none; }

canvas { max-width:100%; width:100% !important; cursor:crosshair; }

/* 卡片 */
.chart-container {
  background:var(--panel); border:1px solid var(--hairline);
  border-radius:18px; padding:20px; margin-bottom:20px; box-shadow:var(--shadow);
}
.chart-container h3 { margin-bottom:10px; color:var(--text); font-size:17px; font-weight:600; letter-spacing:-0.015em; }
.chart-wrap { position:relative; height:600px; }

.stats { text-align:center; color:var(--stat); font-size:13px; margin:12px 0 20px; font-variant-numeric:tabular-nums; }
.zoom-hint { text-align:right; font-size:11px; color:var(--dim); margin-top:8px; }
.zoom-hint button {
  background:var(--btn-bg); color:var(--btn-fg); border:none;
  padding:5px 14px; border-radius:980px; cursor:pointer;
  font-size:12px; font-weight:500; margin-left:8px; transition:background .18s;
}
.zoom-hint button:hover { background:var(--btn-hover); color:var(--btn-hover-fg); }

#loading { display:none; text-align:center; color:var(--accent); font-size:15px; font-weight:500; padding:40px; }
#fileName { margin-left:6px; color:var(--stat); font-size:13px; }
#ivFileName { color:var(--stat); font-size:13px; }

/* 欄位選擇面板 */
#columnConfig {
  background:var(--panel); border:1px solid var(--hairline); border-radius:18px;
  padding:20px; margin-bottom:20px; display:none; box-shadow:var(--shadow);
}
#columnConfig h4 { color:var(--text); font-size:15px; font-weight:600; margin-bottom:12px; letter-spacing:-0.01em; }

}
#plotlineToggle, #themeToggle {
  background:transparent; color:var(--btn-fg); border:none;
  padding:6px 15px; border-radius:980px; cursor:pointer; font-size:12px; font-weight:500;
  transition:background .18s, color .18s;
}
#plotlineToggle:hover, #themeToggle:hover { background:var(--btn-hover); color:var(--btn-hover-fg); }
#plotlineToggle.on { background:var(--accent); color:#fff; }

/* Plotline 讀值 */
.plotline-out {
  margin-top:10px; padding:10px 12px; background:var(--out-bg);
  border:1px solid var(--hairline); border-radius:12px; display:none;

.pl-table { border-collapse:collapse; width:100%; font-size:12px; font-variant-numeric:tabular-nums; }
.pl-table th, .pl-table td {
  padding:5px 10px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--hairline);

.pl-table thead th {
  color:var(--accent); font-weight:600; text-align:right;

.pl-table tbody td { color:var(--tick); }
.pl-table tbody tr:hover td { background:rgba(128,128,128,0.1); }

/* 圖表選單（popover） */
.chart-menu-btn {
  background:transparent; border:none; color:var(--stat); font-size:16px;
  cursor:pointer; padding:2px 9px; line-height:1; border-radius:8px;

.chart-menu-btn:hover { color:var(--text); background:var(--btn-bg); }

.chart-menu-item { padding:9px 16px; font-size:13px; color:var(--text); cursor:pointer; white-space:nowrap; }
.chart-menu-item:hover { background:var(--accent); color:#fff; }
.chart-menu-item.danger { color:var(--danger); }
.chart-menu-item.danger:hover { background:var(--danger); color:#fff; }

/* 拖曳排序 */
.chart-container { transition:transform .35s cubic-bezier(.25,.8,.25,1); }
.chart-container.dragging { opacity:.5; }
.chart-container.drop-target { outline:2px solid var(--accent); outline-offset:-4px; border-radius:18px; }
.sortable-ghost { opacity:.35 !important; background:var(--panel) !important; border-radius:18px; }

.sortable-drag { opacity:.9; box-shadow:0 14px 32px rgba(0,0,0,.34); }
.drag-handle { cursor:grab; color:var(--stat); font-size:13px; padding:3px 8px; border-radius:8px; user-select:none; }

.drag-handle:hover { color:var(--text); background:var(--btn-bg); }

/* 頁尾作者標籤 */
.app-footer {

.app-footer .author { color:var(--stat); font-weight:500; }
.app-footer .ver { opacity:.75; margin-left:8px; }

/* Plotline 讀值表格：欄標題可拖曳換位 + 差異欄標題可雙擊選配對

.pl-table thead th[data-drag="1"] {

.pl-table thead th[data-drag="1"]:hover { background:var(--btn-bg); border-radius:4px; }

}
.pl-table thead th.pl-drop-target { box-shadow:inset 3px 0 0 var(--accent); }
.pl-table thead th[data-col$="(V)"], .pl-table thead th[data-col$="(mV)"] {

}
.pl-table thead th[data-col$="(V)"]:hover { background:color-mix(in srgb, var(--accent) 18%, transparent); }

/* 已載入檔案清單（可逐一移除） */
#fileChips { display:none; margin:10px 0 0; text-align:center; }
#fileChips.on { display:block; }
#fileChips .fc-label { font-size:12px; color:var(--stat); margin-bottom:6px; }
#fileChips .fc-list { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
#fileChips .fc-chip {

#fileChips .fc-x {

/* 頁尾下載區 */

.dl-band .dl-grid {

.dl-band .dl-grid a {

@media (max-width:560px) { .dl-band .dl-grid a { width:100%; } }

<script>
// 下載備援：主程式連結是「相對自己的路徑」，若檔案被改名或換資料夾開，
// fetch 會失敗，此時改以目前頁面內容產生 Blob 讓下載仍然可用。
(function () {
  var TOOL = document.getElementById('dlTool');
  if (!TOOL) return;
  var fallback = false;
  fetch(TOOL.getAttribute('href'), { method: 'GET', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); })
    .catch(function () { fallback = true; })
    .then(function () { _ready(fallback); });

  function _ready(useFallback) {
    TOOL.addEventListener('click', function (e) {
      if (!useFallback) return;              // 連結正常就讓瀏覽器自己處理
      e.preventDefault();
      var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      var url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = TOOL.getAttribute('download') || '測試數據作圖產生器.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    });
  }
})();
</script>

<script>
if (typeof ChartZoom !== 'undefined') Chart.register(ChartZoom);

// All active charts, for TradingView-style X-axis sync
const allCharts = [];
let syncSuppress = false;

// Plotline read-value mode
let plotlineEnabled = false;
let plotlineCount = 0;
let plotlineData = null; // { times, series, numericCols, headers, timeCol }
// IV 曲線專屬的 Plotline 狀態（與一般折線圖各自獨立計次與顯示）
let ivPlotlineCount = 0;
let ivCrosshairX = null;   // 游標所在處的 X 值（電流）
let ivPlotlineMarks = [];  // [{ x, n }]
let ivPlotlineRecords = [];// [{ n, sortKey, cells: [{ label, text }] }]

function applyZoomSync(srcChart) {
  if (syncSuppress) return;
  const xs = srcChart && srcChart.options && srcChart.options.scales && srcChart.options.scales.x;
  if (!xs) return;
  const mn = xs.min, mx = xs.max;
  const hasZoom = mn !== undefined && mx !== undefined;
  syncSuppress = true;
  try {
    allCharts.forEach(ch => {
      if (ch === srcChart) return;
      const s = ch.options && ch.options.scales && ch.options.scales.x;
      if (!s) return;
      if (hasZoom) {
        if (ch.zoomScale) ch.zoomScale('x', { min: mn, max: mx }, 'none');
      } else {
        if (ch.resetZoom) ch.resetZoom();
      }
    });
  } finally {
    syncSuppress = false;
  }
}

// Crosshair sync state — mouse X position shared across all charts
const crosshairState = { x: -1 };

// 重繪請求合併到同一個 animation frame，避免連續點擊／滑動時重複觸發繪製
let redrawPending = false;
function redrawAllCharts() {
  if (redrawPending) return;
  redrawPending = true;
  const run = function() {
    redrawPending = false;
    // 用公開的 render() 重繪；不可用 draw()（Chart.js 內部 API，會讓渲染狀態不同步）。
    // 同時略過目前不可見的圖表，避免對 0 尺寸的畫布繪製。
    allCharts.forEach(function(ch) {
      try {
        if (!ch.canvas || !ch.canvas.offsetParent) return;
        ch.render();
      } catch(e) {}
    });
  };
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(run);
  else setTimeout(run, 16);
}

Chart.register({
  id: 'crosshairSync',
  afterDraw(chart) {
    if (chart.$isIV) return;
    const ctx = chart.ctx;
    const xs = chart.scales.x;
    const ca = chart.chartArea;
    const marks = chart._plotlineMarks;
    if (xs && ca && marks && marks.length) {
      ctx.save();
      ctx.strokeStyle = chart._plotlineStroke || 'rgba(255,217,61,0.6)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      const drawn = [];
      marks.forEach(function(mk) {
        const px = xs.getPixelForValue(mk.x);
        if (px < ca.left || px > ca.right) return;
        ctx.moveTo(px, ca.top);
        ctx.lineTo(px, ca.bottom);
        drawn.push({ px, n: mk.n });
      });
      ctx.stroke();
      ctx.font = 'bold 10px Consolas, monospace';
      ctx.textAlign = 'left';
      const labelColor = chart._plotlineLabel || '#0a84ff';
      drawn.forEach(function(d) {
        const label = String(d.n).padStart(2, '0');
        const tx = d.px + 2;
        const ty = ca.top + 10;
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(tx - 1, ty - 8, tw + 2, 11);
        ctx.fillStyle = labelColor;
        ctx.fillText(label, tx, ty);
      });
      ctx.restore();
    }
    const idx = crosshairState.x;
    if (idx < 0) return;
    if (!xs || !ca) return;
    const px = xs.getPixelForValue(idx);
    if (px < ca.left || px > ca.right) return;
    ctx.save();
    ctx.strokeStyle = isLightTheme() ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(px, ca.top);
    ctx.lineTo(px, ca.bottom);
    ctx.stroke();
    ctx.restore();
  },
});

// IV 曲線專屬的 Plotline 繪圖（垂直線 + 編號 + 游標）
Chart.register({
  id: 'ivCrosshairSync',
  afterDraw(chart) {
    if (!chart.$isIV) return;
    if (!plotlineEnabled) return;
    const ctx = chart.ctx;
    const xs = chart.scales.x;
    const ca = chart.chartArea;
    if (!xs || !ca) return;

    // 已固定的讀值線
    if (ivPlotlineMarks.length) {
      ctx.save();
      ctx.strokeStyle = 'rgba(10,132,255,0.75)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      const drawn = [];
      ivPlotlineMarks.forEach(function(mk) {
        const px = xs.getPixelForValue(mk.x);
        if (px < ca.left || px > ca.right) return;
        ctx.moveTo(px, ca.top);
        ctx.lineTo(px, ca.bottom);
        drawn.push({ px: px, n: mk.n });
      });
      ctx.stroke();
      ctx.font = 'bold 10px "SF Mono", ui-monospace, Menlo, monospace';
      ctx.textAlign = 'left';
      drawn.forEach(function(d) {
        const label = String(d.n).padStart(2, '0');
        const tx = d.px + 2, ty = ca.top + 10;
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(tx - 1, ty - 8, tw + 2, 11);
        ctx.fillStyle = '#0a84ff';
        ctx.fillText(label, tx, ty);
      });
      ctx.restore();
    }

    // 游標虛線
    if (ivCrosshairX === null) return;
    const px = xs.getPixelForValue(ivCrosshairX);
    if (px < ca.left || px > ca.right) return;
    ctx.save();
    ctx.strokeStyle = isLightTheme() ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(px, ca.top);
    ctx.lineTo(px, ca.bottom);
    ctx.stroke();
    ctx.restore();
  },
});

// IV 曲線的 Plotline：獨立讀值框、獨立編號（ivPlotline01…）
function setupIVPlotline(chart, canvas) {
  const container = canvas.closest('.chart-container');
  if (!container) return;
  const outDiv = document.createElement('div');
  outDiv.className = 'plotline-out';
  outDiv.id = 'ivPlotlineOut';
  container.appendChild(outDiv);
  chart._plotlineOut = outDiv;

  let dragX = null, dragY = null;
  canvas.addEventListener('mousedown', function(e) {
    dragX = e.clientX; dragY = e.clientY;
  });
  canvas.addEventListener('mousemove', function(e) {
    if (!plotlineEnabled) return;
    if (e.buttons & 1) return;
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (mx < ca.left || mx > ca.right || my < ca.top || my > ca.bottom) {
      if (ivCrosshairX !== null) { ivCrosshairX = null; try { chart.render(); } catch (err) {} }
      return;
    }
    const xs = chart.scales && chart.scales.x;
    if (!xs) return;
    const v = xs.getValueForPixel(mx);
    if (isNaN(v)) return;
    if (ivCrosshairX !== v) { ivCrosshairX = v; try { chart.render(); } catch (err) {} }
  });
  canvas.addEventListener('mouseleave', function() {
    if (ivCrosshairX !== null) { ivCrosshairX = null; try { chart.render(); } catch (err) {} }
  });
  canvas.addEventListener('click', function(e) {
    if (!plotlineEnabled) return;
    if (dragX !== null &&
        (Math.abs(e.clientX - dragX) > 4 || Math.abs(e.clientY - dragY) > 4)) return;
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (mx < ca.left || mx > ca.right || my < ca.top || my > ca.bottom) return;
    const xs = chart.scales && chart.scales.x;
    if (!xs) return;
    const xVal = xs.getValueForPixel(mx);
    if (isNaN(xVal)) return;

    const xName = (ivSel.xi >= 0 && ivRefSeries().headers[ivSel.xi]) || 'X';

    // 每條曲線取 X 最接近的點（記錄所屬 dataset 索引，隱藏時可同步從表格移除）
    const cells = [{ label: xName, text: xVal.toFixed(4) }];
    let nearestY = NaN, nearestDs = -1;
    (chart.data.datasets || []).forEach(function(ds, dsIdx) {
      if (ds.hidden) return;
      if (ds.yAxisID === 'yPow') return;          // 功率曲線另外用 I×V 表示
      const pts = ds.data || [];
      if (!pts.length) return;
      let best = null, bestD = Infinity;
      for (let i = 0; i < pts.length; i++) {
        const d = Math.abs(pts[i].x - xVal);
        if (d < bestD) { bestD = d; best = pts[i]; }
      }
      if (best) {
        cells.push({
          label: ds.label.replace(/ \(V\)$/, ''),
          text: (+best.y).toFixed(4),
          ds: dsIdx
        });
        if (isNaN(nearestY)) { nearestY = best.y; nearestDs = dsIdx; }
      }
    });

    // 性能差異不寫死在此：改由 render 時依「目前配對」計算，
    // 才能在點擊後重新挑選要相減的兩條曲線，並回頭套用到既有紀錄
    if (!isNaN(nearestY)) cells.push({ label: 'P (W)', text: (xVal * nearestY).toFixed(3) });

    ivPlotlineCount++;
    ivPlotlineRecords.push({
      n: ivPlotlineCount, sortKey: xVal, cells: cells,
      pDs: nearestDs, pY: nearestY, xVal: xVal
    });
    renderIVPlotline();
    ivPlotlineMarks.push({ x: xVal, n: ivPlotlineCount });
    try { chart.render(); } catch (err) {}
  });
}

// 資料集是否可見：一般圖用 meta.hidden，IV 圖用 dataset.hidden，兩者都要檢查
function isDatasetVisible(ch, idx) {
  const ds = ch && ch.data && ch.data.datasets && ch.data.datasets[idx];
  if (!ds) return false;
  if (ds.hidden) return false;
  try {
    const meta = ch.getDatasetMeta(idx);
    if (meta && meta.hidden === true) return false;
  } catch (e) {}
  return true;
}

// 清空指定折線圖的 Plotline 讀值：圖上的垂直標記＋底下表格
function clearChartPlotline(ch) {
  if (!ch) return;
  ch._plotlineMarks = [];
  ch._plotlineRecords = [];
  const el = ch._plotlineOut;
  if (el) { el.innerHTML = ''; el._plHtml = ''; el.style.display = 'none'; }
  try { ch.render(); } catch (e) {}
  // 序號由所有折線圖共用：仍有其他圖保留讀值時不歸零，避免序號重複
  const rest = (allCharts || []).some(function(c) {
    return c !== ch && c._plotlineRecords && c._plotlineRecords.length;
  });
  if (!rest) plotlineCount = 0;
}

// 清空 IV 讀值狀態：圖上的垂直標記＋底下表格，序號重新從 01 開始
function clearIVPlotline() {
  ivPlotlineCount = 0;
  ivPlotlineMarks = [];
  ivPlotlineRecords = [];
  ivCrosshairX = null;
  const el = document.getElementById('ivPlotlineOut');
  if (el) { el.innerHTML = ''; el._plHtml = ''; el.style.display = 'none'; }
  if (ivChart) { try { ivChart.render(); } catch (e) {} }
}

// IV 各資料集的線色（依資料集索引排列），供表格標題對應著色
function ivDatasetColors() {
  const arr = [];
  const list = (ivChart && ivChart.data && ivChart.data.datasets) || [];
  list.forEach(function(ds) {
    arr.push(typeof ds.borderColor === 'string' ? ds.borderColor : '');
  });
  return arr;
}

// ===== IV 前-後差異：配對可由使用者挑選 =====
// 使用者在「前-後(V)」欄標題上雙擊即可改選要相減的兩條曲線
let ivDiffPairSel = null;    // { a: 曲線名稱, b: 曲線名稱 }；null = 自動取前兩條可見曲線
let ivColOrder = [];         // 欄位顯示順序（標籤陣列），由拖曳標題改變

// 目前可見的 IV 曲線名稱（排除右側功率軸）
function ivCurveNames() {
  const names = [];
  const list = (ivChart && ivChart.data && ivChart.data.datasets) || [];
  list.forEach(function (ds, i) {
    if (ds.yAxisID === 'yPow') return;
    if (!isDatasetVisible(ivChart, i)) return;
    names.push(String(ds.label || '').replace(/ \(V\)$/, ''));
  });
  return names;
}

// 目前實際採用的配對：
// 使用者明確選過配對時，只要其中一條被圖例隱藏就「不算」，
// 讓差異欄消失——不能默默換成別的配對，否則顯示的數值會與使用者的選擇不符。
// 未選過（自動模式）才退回前兩條可見曲線。
function ivResolvedPair() {
  const names = ivCurveNames();
  if (names.length < 2) return null;
  const s = ivDiffPairSel;
  if (s) {
    if (s.a === s.b) return null;
    if (names.indexOf(s.a) < 0 || names.indexOf(s.b) < 0) return null;
    return s;
  }
  return { a: names[0], b: names[1] };
}

// 欄標題顯示的名稱，例如「Mini Fifth-55 SC-850g Sixth Time 55 SC」
function ivDiffLabel() {
  const p = ivResolvedPair();
  return p ? (p.a + '-' + p.b) : '';
}

// 依配對從該列的 cell 取值相減；任一曲線不存在（被圖例隱藏）就回傳 null
function ivDiffValue(cells) {
  const p = ivResolvedPair();
  if (!p) return null;
  let va = null, vb = null;
  for (let i = 0; i < cells.length; i++) {
    if (cells[i].label === p.a) va = parseFloat(cells[i].text);
    else if (cells[i].label === p.b) vb = parseFloat(cells[i].text);
  }
  if (va === null || vb === null || isNaN(va) || isNaN(vb)) return null;
  return va - vb;
}

// 圖例切換顯示／隱藏、或配對改變後，重建 IV 讀值表格（含前-後差異欄）
function renderIVPlotline() {
  const outDiv = document.getElementById('ivPlotlineOut');
  if (!outDiv) return;
  if (!ivPlotlineRecords.length) return;
  const pair = ivResolvedPair();
  const dLabel = pair ? (pair.a + '-' + pair.b) : '';
  const filtered = ivPlotlineRecords.map(function (r) {
    const cells = r.cells.filter(function (c) {
      return c.ds === undefined || isDatasetVisible(ivChart, c.ds);
    });
    // P (W) 依據「點擊當下最前面那條可見曲線」計算，
    // 若該曲線已被隱藏，P 也一併移除，避免顯示看不見的來源
    if (r.pDs >= 0 && !isDatasetVisible(ivChart, r.pDs)) {
      for (let i = cells.length - 1; i >= 0; i--) {
        if (cells[i].label === 'P (W)') cells.splice(i, 1);
      }
    }
    // 前-後：每次重繪都依「目前配對」重新計算，置於 P (W) 之前
    const dV = ivDiffValue(cells);
    if (dLabel && dV !== null) {
      const ins = [
        { label: dLabel + '(V)', text: dV.toFixed(3), isDiff: true },
        { label: dLabel + '(mV)', text: (dV * 1000).toFixed(0), isDiff: true }
      ];
      let at = -1;
      for (let i = 0; i < cells.length; i++) if (cells[i].label === 'P (W)') { at = i; break; }
      if (at >= 0) cells.splice(at, 0, ins[0], ins[1]);
      else cells.push(ins[0], ins[1]);
    }
    return { n: r.n, sortKey: r.sortKey, cells: cells };
  });
  renderPlotlineTable(outDiv, filtered, true, ivDatasetColors(), ivColOrder, function () {
    // 拖曳換位後清掉 HTML 快取並重繪，順序才會真的套用
    outDiv._plHtml = '';
    renderIVPlotline();
  });
}

// 舊的圖例連動入口改為轉呼叫 renderIVPlotline
function refreshIVPlotlineTable() { renderIVPlotline(); }

// 雙擊「…(V)」欄標題 → 選要被減的與要減去的曲線
function askIVDiffPair() {
  const names = ivCurveNames();
  if (names.length < 2) { alert('至少要有兩條可見的 IV 曲線才能比較差異'); return; }
  const cur = ivResolvedPair();
  const opts = function (sel) {
    return names.map(function (n) {
      return '<option value="' + escHtml(n) + '"' + (n === sel ? ' selected' : '') + '>' + escHtml(n) + '</option>';
    }).join('');
  };
  document.querySelectorAll('.diff-modal').forEach(function (el) { el.remove(); });
  const ov = document.createElement('div');
  ov.className = 'diff-modal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center';
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--panel);color:var(--text);border:1px solid var(--accent);border-radius:8px;padding:16px 20px;min-width:320px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,0.35)';
  box.innerHTML = '<h4 style="color:var(--accent);font-size:14px;margin-bottom:10px">📐 選擇要相減的兩條 IV 曲線</h4>'
    + '<label style="display:block;color:var(--tick);font-size:12px;margin-bottom:3px">被減的曲線（ minuend ）</label>'
    + '<select class="dpA" style="width:100%;margin-bottom:8px;background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:4px 6px;font-size:12px">'
    + opts(cur.a) + '</select>'
    + '<label style="display:block;color:var(--tick);font-size:12px;margin-bottom:3px">減去的曲線（ subtrahend ）</label>'
    + '<select class="dpB" style="width:100%;margin-bottom:10px;background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:4px 6px;font-size:12px">'
    + opts(cur.b) + '</select>'
    + '<div class="dpPrev" style="font-size:11px;color:var(--dim);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>'
    + '<div style="text-align:right">'
    + '<button class="dpOk" style="background:var(--btn-bg);color:var(--text);border:1px solid var(--accent);padding:4px 16px;border-radius:4px;cursor:pointer;font-size:12px;margin-right:6px">套用</button>'
    + '<button class="dpAuto" style="background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--input-border);padding:4px 14px;border-radius:4px;cursor:pointer;font-size:12px;margin-right:6px">自動</button>'
    + '<button class="dpCancel" style="background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--input-border);padding:4px 16px;border-radius:4px;cursor:pointer;font-size:12px">取消</button>'
    + '</div>';
  ov.appendChild(box);
  document.body.appendChild(ov);
  const selA = box.querySelector('.dpA'), selB = box.querySelector('.dpB');
  const prev = box.querySelector('.dpPrev');
  function upd() {
    if (selA.value === selB.value) {
      prev.textContent = '⚠ 兩邊選了同一條曲線，差異會是 0';
      prev.style.color = '#ff9f0a';
    } else {
      prev.textContent = '欄標題會變成：' + selA.value + '-' + selB.value + '(V)';
      prev.style.color = 'var(--dim)';
    }
  }
  selA.onchange = upd; selB.onchange = upd; upd();
  ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
  box.querySelector('.dpCancel').onclick = function () { ov.remove(); };
  box.querySelector('.dpAuto').onclick = function () {
    ivDiffPairSel = null; ov.remove(); renderIVPlotline();
  };
  box.querySelector('.dpOk').onclick = function () {
    ivDiffPairSel = { a: selA.value, b: selB.value };
    ov.remove();
    renderIVPlotline();
  };
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); box.querySelector('.dpOk').click(); }
    else if (e.key === 'Escape') { ov.remove(); }
  });
}

function refreshLinePlotlineTable(chart) {
  if (!chart || !chart._plotlineRecords || !chart._plotlineRecords.length) return;
  const outDiv = chart._plotlineOut;
  if (!outDiv) return;
  const filtered = chart._plotlineRecords.map(function(r) {
    return {
      n: r.n, sortKey: r.sortKey,
      cells: r.cells.filter(function(c) {
        return c.ds === undefined || isDatasetVisible(chart, c.ds);
      })
    };
  });
  renderPlotlineTable(outDiv, filtered);
}

function setupCrosshair(chart, canvas, labels) {
  canvas.addEventListener('mousemove', function(e) {
    if (e.buttons & 1) return;
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (mx < ca.left || mx > ca.right || my < ca.top || my > ca.bottom) {
      if (crosshairState.x !== -1) { crosshairState.x = -1; redrawAllCharts(); }
      return;
    }
    const xs = chart.scales && chart.scales.x;
    if (!xs) return;
    const raw = xs.getValueForPixel(mx);
    let xIdx;
    if (typeof raw === 'number') xIdx = Math.round(raw);
    else if (typeof raw === 'string') xIdx = labels.indexOf(raw);
    else xIdx = Math.round(parseFloat(raw));
    if (xIdx < 0 || xIdx >= labels.length) return;
    if (crosshairState.x !== xIdx) {
      crosshairState.x = xIdx;
      redrawAllCharts();
    }
  });
  canvas.addEventListener('mouseleave', function() {
    if (crosshairState.x !== -1) { crosshairState.x = -1; redrawAllCharts(); }
  });
}

const chartsDiv = document.getElementById('charts');
const loading = document.getElementById('loading');
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const fileChipsDiv = document.getElementById('fileChips');
const columnConfigDiv = document.getElementById('columnConfig');
const plotlineToggle = document.getElementById('plotlineToggle');

// ===== 檔案累積載入 =====
// 需求：按「選擇檔案」後新選的檔案是「加到」既有清單，而不是取代。
// loadedFiles 保存所有已加入的 File；1 個走單檔流程，2 個以上走多檔疊圖。
let loadedFiles = [];       // File[]
const parsedCache = new Map();   // 'name|size|lastModified' → analyzeTable 結果（避免重複解析）
let pickedColNames = new Set();  // 上次勾選的欄位名（小寫），重新開面板時預設勾回

function fileKey(f) { return f.name + '|' + f.size + '|' + f.lastModified; }

// 只清掉單檔流程產生的疊圖與個別圖（多檔圖交給 clearMultiChartsKeepFiles 處理）
function clearSingleCharts() {
  chartsDiv.innerHTML = '';
  allCharts.slice().forEach(function (ch) {
    if (ch === multiChart) return;
    try { ch.destroy(); } catch (e) {}
    const i = allCharts.indexOf(ch);
    if (i >= 0) allCharts.splice(i, 1);
  });
}

// 依目前 loadedFiles 重新繪製（1 檔＝單檔流程，≥2 檔＝多檔疊圖，0 檔＝清空）
function renderLoadedFiles() {
  renderFileChips();
  if (!loadedFiles.length) {
    resetChartsToEmpty();
    return;
  }
  if (loadedFiles.length === 1) {
    // 單檔：先收掉多檔圖，避免兩種圖表同時殘留在畫面上
    clearMultiChartsKeepFiles();
    const f = loadedFiles[0];
    loading.style.display = 'block';
    readFileText(f).then(function (text) {
      loading.style.display = 'none';
      if (!text) { alert('檔案讀取失敗：' + f.name); return; }
      parseAndBuild(text, f.name);
    });
  } else {
    // 多檔：先收掉單檔的疊圖／個別圖，否則會與多檔疊圖同時顯示
    clearSingleCharts();
    loadMultiFiles(loadedFiles);
  }
}

// 清空所有圖表與面板（檔案清單也一併清掉）
function resetChartsToEmpty() {
  clearMultiChartsKeepFiles();
  chartsDiv.innerHTML = '';
  columnConfigDiv.style.display = 'none';
  columnConfigDiv.innerHTML = '';
  allCharts.forEach(function (ch) { try { ch.destroy(); } catch (e) {} });
  allCharts.length = 0;
  loading.style.display = 'none';
  fileName.textContent = '未選擇檔案';
  renderFileChips();
}

// 已載入檔案清單（每個檔案可單獨 ✕ 移除）
function renderFileChips() {
  if (!fileChipsDiv) return;
  if (!loadedFiles.length) {
    fileChipsDiv.className = '';
    fileChipsDiv.innerHTML = '';
    return;
  }
  let html = '<div class="fc-label">已載入 ' + loadedFiles.length + ' 個檔案（可再按上方按鈕繼續加入，最多 '
    + MULTI_MAX + ' 個）</div><div class="fc-list">';
  loadedFiles.forEach(function (f, i) {
    html += '<span class="fc-chip" title="' + escHtml(f.name) + '">'
      + '<span class="fc-name">' + escHtml(f.name) + '</span>'
      + '<span class="fc-kb">' + (f.size / 1024).toFixed(0) + ' KB</span>'
      + '<button class="fc-x" data-i="' + i + '" title="移除這個檔案" aria-label="移除">✕</button>'
      + '</span>';
  });
  if (loadedFiles.length >= 2) {
    html += '<button class="fc-clear" id="fcClearAll">🗑️ 清除全部</button>';
  }
  html += '</div>';
  fileChipsDiv.innerHTML = html;
  fileChipsDiv.className = 'on';
  fileChipsDiv.querySelectorAll('.fc-x').forEach(function (b) {
    b.addEventListener('click', function () {
      const i = parseInt(this.getAttribute('data-i'), 10);
      const gone = loadedFiles[i];
      loadedFiles.splice(i, 1);
      parsedCache.delete(fileKey(gone));
      if (!loadedFiles.length) pickedColNames = new Set();
      renderLoadedFiles();
    });
  });
  const ca = document.getElementById('fcClearAll');
  if (ca) ca.addEventListener('click', function () {
    loadedFiles = [];
    parsedCache.clear();
    pickedColNames = new Set();
    renderLoadedFiles();
  });
}

// 把新選的檔案併入既有清單
function appendFiles(list) {
  const added = [], dup = [];
  let over = 0;
  list.forEach(function (f) {
    const k = fileKey(f);
    const exists = loadedFiles.some(function (g) { return fileKey(g) === k; });
    if (exists) { dup.push(f.name); return; }
    if (loadedFiles.length >= MULTI_MAX) { over++; return; }
    loadedFiles.push(f);
    added.push(f.name);
  });
  if (dup.length) alert('已在清單中，未重複加入：\n' + dup.join('\n'));
  if (over) alert('最多只能同時載入 ' + MULTI_MAX + ' 個檔案，有 ' + over + ' 個未加入。');
  return added.length;
}

// Plotline 開啟時停用拖曳縮放／平移：讀值模式下點擊的同時若滑鼠有微小位移，
// 會被 zoom 外掛當成框選縮放，畫面被放大到只剩一小段，看起來像資料線消失。
function syncZoomEnabledByPlotline() {
  const list = allCharts.slice();
  if (ivChart) list.push(ivChart);          // IV 圖表不在 allCharts 內，需另外帶入
  list.forEach(function(ch) {
    try {
      const z = ch.options && ch.options.plugins && ch.options.plugins.zoom;
      if (!z) return;
      if (z.zoom && z.zoom.drag) z.zoom.drag.enabled = !plotlineEnabled;
      if (z.pan) z.pan.enabled = !plotlineEnabled;
      ch.render();
    } catch(e) {}
  });
}

// cols: array of numericCols indices this chart should show values for
function parseColor(str) {
  if (!str) return null;
  let s = String(str).trim();
  let m = s.match(/^#([0-9a-fA-F]{6})$/);
  if (m) return { r: parseInt(m[1].slice(0, 2), 16), g: parseInt(m[1].slice(2, 4), 16), b: parseInt(m[1].slice(4, 6), 16) };
  m = s.match(/^#([0-9a-fA-F]{3})$/);
  if (m) { const x = m[1]; return { r: parseInt(x[0] + x[0], 16), g: parseInt(x[1] + x[1], 16), b: parseInt(x[2] + x[2], 16) }; }
  m = s.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  if (m) return { r: +m[1], g: +m[2], b: +m[3] };
  return null;
}
function colorDist(a, b) { return Math.sqrt((a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2); }
const PLOTLINE_COLORS = [

// Plotline 讀值表格：第一欄＝序號、第一列＝各欄標籤
// records: [{ n, sortKey, cells: [{ label, text }] }]
function renderPlotlineTable(outDiv, records, asc, dsColors, colOrder, onColOrderChanged) {
  if (!outDiv) return;
  // asc 為 true 時由小到大排序（IV 曲線以電流排序）；未指定則由大到小
  // dsColors：依資料集索引排列的線色陣列，標題依對應曲線著色
  // colOrder：欄位顯示順序（標籤陣列，可由拖曳標題改變）；未給則用自然順序
  // onColOrderChanged：拖曳完成後的通知，用來清快取並重繪
  const list = records.slice().sort(function(a, b) {
    return asc ? (a.sortKey - b.sortKey) : (b.sortKey - a.sortKey);
  });
  if (!list.length) { outDiv.innerHTML = ''; outDiv.style.display = 'none'; return; }
  const labels = [], labelDs = {};
  list.forEach(function(r) {
    r.cells.forEach(function(c) {
      if (labels.indexOf(c.label) < 0) {
        labels.push(c.label);
        if (c.ds !== undefined) labelDs[c.label] = c.ds;
      }
    });
  });
  // 依 colOrder 重排；order 裡沒有的欄位維持自然順序補在後面，
  // 用標籤而非索引排序，圖例切換導致欄位增減時順序才不會錯位
  const shown = orderLabels(labels, colOrder);
  // 只有提供 colOrder 的表格（IV 讀值表）才啟用拖曳，避免折線圖出現無效的拖曳游標
  const canDrag = Array.isArray(colOrder);
  let html = '<table class="pl-table"><thead><tr><th class="pl-th-fixed">序號</th>';
  shown.forEach(function(l) {
    const dsi = labelDs[l];
    const col = (dsi !== undefined && dsColors) ? dsColors[dsi] : '';
    html += '<th' + (canDrag ? ' data-drag="1"' : '')
      + (col ? ' style="color:' + escHtml(col) + '"' : '')
      + ' data-col="' + escHtml(l) + '"'
      + (canDrag ? ' title="可拖曳調整欄位順序"' : '') + '>' + escHtml(l) + '</th>';
  });
  html += '</tr></thead><tbody>';
  list.forEach(function(r) {
    html += '<tr><td>' + String(r.n).padStart(2, '0') + '</td>';
    shown.forEach(function(l) {
      let cell = null;
      for (let i = 0; i < r.cells.length; i++) if (r.cells[i].label === l) { cell = r.cells[i]; break; }
      html += '<td data-col="' + escHtml(l) + '">'
        + (cell ? escHtml(cell.text) : '') + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  // 內容沒變就不碰 DOM，避免連續點擊時反覆重建造成畫布重繪異常
  if (outDiv._plHtml !== html) {
    outDiv._plHtml = html;
    outDiv.innerHTML = html;
    attachColDrag(outDiv, colOrder, onColOrderChanged);
    bindDiffHeader(outDiv);
  }
  outDiv.style.display = 'block';
}

// 「…(V)」欄標題可雙擊開啟配對選擇（只給 IV 讀值表用，
// 折線圖的欄名也可能以 (V) 結尾，所以用 outDiv 身分把關）
function bindDiffHeader(outDiv) {
  if (outDiv.id !== 'ivPlotlineOut') return;
  const table = outDiv.querySelector('table.pl-table');
  if (!table || table._diffBound) return;
  table._diffBound = true;
  table.addEventListener('dblclick', function (e) {
    const th = e.target.closest && e.target.closest('thead th');
    if (!th) return;
    const col = th.getAttribute('data-col');
    if (!col || col.slice(-3) !== '(V)') return;
    askIVDiffPair();
  });
}

// 依指定的欄位順序重排；順序以「標籤」記錄，順序裡沒有的欄位維持自然順序補在後面
function orderLabels(labels, order) {
  if (!order || !order.length) return labels.slice();
  const has = {};
  order.forEach(function (l) { has[l] = true; });
  const out = [];
  order.forEach(function (l) { if (labels.indexOf(l) >= 0) out.push(l); });
  labels.forEach(function (l) { if (!has[l]) out.push(l); });
  return out;
}

// 欄標題拖曳換位置：把整欄（標題＋每一列的資料）一起搬，序號欄固定不動
//
// 作法與 Motion 的 Reorder 相同：拖曳過程中「真的」改變 DOM 欄位順序，
// 改變前後各量一次位置，把差值當作起始位移再用動畫補回（FLIP），
// 被拖的那欄則以 transform 即時貼齊游標、不參與動畫。
// 用 pointer events 實作，所以觸控也能拖。
function attachColDrag(outDiv, colOrder, onChange) {
  const table = outDiv.querySelector('table.pl-table');
  if (!table || table._dragBound) return;
  table._dragBound = true;
  const headRow = table.querySelector('thead tr');
  if (!headRow) return;
  if (colOrder && !colOrder.length) {
    headRow.querySelectorAll('th[data-drag="1"]').forEach(function (th) {
      colOrder.push(th.getAttribute('data-col'));
    });
  }

  const MOVE_THRESHOLD = 4;   // 超過這個位移才算拖曳，避免與點擊／雙擊衝突
  const EDGE_ZONE = 56;       // 自動捲動的邊緣觸發區
  const FLIP_MS = 200;
  const FLIP_EASE = 'cubic-bezier(.2,.8,.3,1)';
  let drag = null;

  function ths() {
    return Array.prototype.slice.call(
      table.querySelectorAll('thead th[data-drag="1"]'));
  }
  function findTh(label) {
    return table.querySelector('thead th[data-col="' + CSS.escape(label) + '"]');
  }
  // 同一欄的所有儲存格（每個 tbody 列各一格），序號欄不在此列
  function cellsOf(label) {
    return Array.prototype.slice.call(
      table.querySelectorAll('tbody td[data-col="' + CSS.escape(label) + '"]'));
  }
  function allRows() {
    const rows = [headRow];
    table.querySelectorAll('tbody tr').forEach(function (tr) { rows.push(tr); });
    return rows;
  }
  function clearMarks() {
    table.querySelectorAll('th.pl-drop-target').forEach(function (el) {
      el.classList.remove('pl-drop-target');
    });
  }
  function cancelAnims(els) {
    els.forEach(function (el) {
      if (!el._flip) return;
      el._flip.cancel();
      el._flip = null;
    });
  }
  // 把某欄從 from 位置搬到 to 位置（直接動 DOM，含表頭與每一列）
  function moveColumnTo(label, to) {
    const order = ths().map(function (th) { return th.getAttribute('data-col'); });
    const at = order.indexOf(label);
    if (at < 0 || at === to) return false;
    order.splice(at, 1);
    order.splice(to, 0, label);
    allRows().forEach(function (tr) {
      const map = {};
      for (let i = 1; i < tr.cells.length; i++) {
        map[tr.cells[i].getAttribute('data-col')] = tr.cells[i];
      }
      const frag = document.createDocumentFragment();
      order.forEach(function (l) { if (map[l]) frag.appendChild(map[l]); });
      while (tr.cells.length > 1) tr.removeChild(tr.cells[1]);
      while (frag.firstChild) tr.appendChild(frag.firstChild);
    });
    return true;
  }
  // 把一組元素從位移 d 平滑回到 0（FLIP 的補間）
  function flipTo(els, d) {
    els.forEach(function (el) {
      cancelAnims([el]);
      if (!el.animate) return;                    // 極舊瀏覽器就直接跳
      el._flip = el.animate(
        [{ transform: 'translateX(' + d + 'px)' }, { transform: 'translateX(0px)' }],
        { duration: FLIP_MS, easing: FLIP_EASE }
      );
    });
  }
  // 被拖的欄：不參與動畫，直接貼齊游標
  function followPointer() {
    const d = drag;
    const slotLeft = d.slotLeft - (outDiv.scrollLeft - d.startScroll);
    const want = d.px - d.grabOffset;
    const shift = want - slotLeft;
    const st = Math.abs(shift) < 0.01 ? '' : 'translateX(' + shift.toFixed(2) + 'px)';
    d.th.style.transform = st;
    d.cells.forEach(function (td) { td.style.transform = st; });
  }

// 依游標位置決定要插到第幾欄。
  // 以「拖曳開始時」的原始版面位置 + 游標位移來算，
  // 不可用 d.slotLeft：它會隨每次重排而跳動，會造成插入點在邊界附近
  // 反覆震盪、不停取消並重啟動畫，看起來就像沒有動畫。
  function targetIndex() {
    const d = drag;
    const scrolled = outDiv.scrollLeft - d.startScroll;
    const eff = (d.px - d.grabX) + scrolled;
    const center = d.orig[d.from].left + eff + d.width / 2;
    let to = 0;
    for (let k = 0; k < d.orig.length; k++) {
      if (k === d.from) continue;
      if (d.orig[k].left + d.orig[k].w / 2 < center) to++;
    }
    return to;
  }

// 依「欄位寬度」推算各欄在新順序下的自然位置（不受正在播放的動畫影響）。
  // FLIP 若用 getBoundingClientRect() 量 before，會量到別欄「動畫播到一半」的位置，
  // 快速連續跨越時 delta 會愈縮愈小並把上一段動畫取消重開，結果看起來就是沒動畫。
  // 這裡改以寬度累加求出純粹的版面位置；每欄寬度在拖曳期間固定，故可精確推算。
  function naturals(order) {
    const d = drag;
    const shift = outDiv.scrollLeft - d.startScroll;
    const m = {};
    let x = d.baseLeft;
    for (let i = 0; i < order.length; i++) {
      m[order[i]] = x;
      x += d.widths[order[i]];
    }
    for (const k in m) m[k] -= shift;
    return m;
  }

  function applyShift() {
    const d = drag;
    const to = targetIndex();
    if (to !== d.to) {
      const order = ths().map(function (th) { return th.getAttribute('data-col'); });
      const at = order.indexOf(d.label);
      order.splice(at, 1);
      order.splice(to, 0, d.label);
      // 量「當下視覺位置」：這正是新動畫該從哪裡起跳（含前一段動畫的進度，
      // 因此中途改變方向或加速都不會跳動）
      const visual = {};
      d.hs.forEach(function (th) {
        const l = th.getAttribute('data-col');
        visual[l] = th.getBoundingClientRect().left;
      });
      if (moveColumnTo(d.label, to)) {
        d.hs = ths();
        d.cells = cellsOf(d.label);
        d.th = findTh(d.label);
        const after = naturals(order);
        d.hs.forEach(function (th) {
          const l = th.getAttribute('data-col');
          if (l === d.label) return;              // 被拖的欄不參與動畫
          const delta = visual[l] - after[l];
          if (Math.abs(delta) > 0.5) flipTo([th].concat(cellsOf(l)), delta);
        });
        d.slotLeft = after[d.label];
      }
      d.to = to;
      clearMarks();
      const list = ths();
      if (to >= 0 && to < list.length && to !== d.from) {
        list[to].classList.add('pl-drop-target');
      }
    }
    followPointer();
  }

  // 拖曳中把游標移到容器邊緣時自動捲動，越靠近邊緣捲越快。
  // 用 setInterval 而非 requestAnimationFrame：無頭環境不推進 rAF，
  // 且容器位置在拖曳期間不會變動，讀一次版面即可。
  function autoScrollTick() {
    if (!drag) return;
    const box = drag.box;
    let v = 0;
    if (drag.px < box.left + EDGE_ZONE) {
      v = -Math.max(1, Math.ceil((box.left + EDGE_ZONE - drag.px) / 4));
    } else if (drag.px > box.right - EDGE_ZONE) {
      v = Math.max(1, Math.ceil((drag.px - (box.right - EDGE_ZONE)) / 4));
    }
    if (v) {
      const before = outDiv.scrollLeft;
      outDiv.scrollLeft += v;
      if (outDiv.scrollLeft !== before) followPointer();
    }
  }

  function onDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const th = e.target && e.target.closest
      ? e.target.closest('th[data-drag="1"]') : null;
    if (!th) return;
    const hs = ths();
    const from = hs.indexOf(th);
    if (from < 0) return;
    const r = th.getBoundingClientRect();
    drag = {
      th: th, from: from, to: from,
      label: th.getAttribute('data-col'),
      grabX: e.clientX, px: e.clientX,
      grabOffset: e.clientX - r.left,
      width: r.width,
orig: hs.map(function (x) {
        const q = x.getBoundingClientRect();
        return { left: q.left, w: q.width };
      }),
      widths: (function () {
        const w = {};
        hs.forEach(function (x) { w[x.getAttribute('data-col')] = x.getBoundingClientRect().width; });
        return w;
      })(),
      baseLeft: r.left,
      hs: hs, cells: cellsOf(th.getAttribute('data-col')),
      slotLeft: r.left,
      box: outDiv.getBoundingClientRect(),
      startScroll: outDiv.scrollLeft,
      active: false, timer: 0
    };
    // 刻意不呼叫 preventDefault()，否則雙擊選配對會失效
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  function onMove(e) {
    if (!drag) return;
    drag.px = e.clientX;
    if (!drag.active) {
      if (Math.abs(e.clientX - drag.grabX) < MOVE_THRESHOLD) return;
      drag.active = true;
      table.classList.add('pl-dragging-table');
      drag.th.classList.add('pl-dragging');
      drag.timer = setInterval(autoScrollTick, 16);
    }
    e.preventDefault();
    applyShift();
  }

  function onUp() {
    if (!drag) return;
    const d = drag;
    drag = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if (d.timer) clearInterval(d.timer);

if (d.active) {
      // 被拖的欄：從目前貼游標的位置，平滑歸位到它的欄位插槽。
      // 不可直接清掉 transform，否則放開的瞬间會跳一下。
      const th = findTh(d.label);
      [th].concat(cellsOf(d.label)).forEach(function (el) {
        cancelAnims([el]);
        const cur = el.style.transform;
        el.style.transform = '';
        if (cur && el.animate) {
          el._flip = el.animate(
            [{ transform: cur }, { transform: 'translateX(0px)' }],
            { duration: FLIP_MS, easing: FLIP_EASE }
          );
        }
      });
      th.classList.remove('pl-dragging');
      table.classList.remove('pl-dragging-table');
      clearMarks();
    }

if (!d.active) return;
    const all = ths().map(function (x) { return x.getAttribute('data-col'); });
    const arr = all.filter(function (l) { return l !== d.label; });
    arr.splice(d.to, 0, d.label);
    if (colOrder) colOrder.splice(0, colOrder.length, ...arr);
    // 拖曳過程中 DOM 欄位順序已經就是最終順序了，
    // 若再呼叫 onChange() 會整張表格重繪，把上面的歸位動畫洗掉而變成跳位，
    // 所以只有在順序真的不一致時才重繪。
    const nowOrder = ths().map(function (x) { return x.getAttribute('data-col'); });
    const same = nowOrder.length === arr.length
      && nowOrder.every(function (l, i) { return l === arr[i]; });
    if (same) {
      // 只清掉 HTML 快取，避免下次比對用到舊字串
      outDiv._plHtml = null;
    } else if (onChange) {
      onChange();
    }
  }

  headRow.addEventListener('pointerdown', onDown);
}

function setupPlotline(chart, canvas, labels, cols) {
  const container = canvas.closest('.chart-container');
  if (!container) return;
  const outDiv = document.createElement('div');
  outDiv.className = 'plotline-out';
  container.appendChild(outDiv);
  chart._plotlineOut = outDiv;
  chart._plotlineMarks = [];
  chart._plotlineRecords = [];
  const lineColors = (chart.data.datasets || []).map(ds => parseColor(ds.borderColor)).filter(Boolean);
  const CANDS = plotlineCandidates();
  let picked = CANDS[0];
  for (const c of CANDS) {
    const tooClose = lineColors.some(lc => colorDist(lc, c.rgb) < 80);
    if (!tooClose) { picked = c; break; }
  }
  chart._plotlineStroke = picked.stroke;
  chart._plotlineLabel = picked.label;
  let dragStartX = null, dragStartY = null;
  canvas.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
  });
  canvas.addEventListener('click', function(e) {
    if (!plotlineEnabled || !plotlineData) return;
    if (dragStartX !== null &&
        (Math.abs(e.clientX - dragStartX) > 4 || Math.abs(e.clientY - dragStartY) > 4)) return;
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (mx < ca.left || mx > ca.right || my < ca.top || my > ca.bottom) return;
    const xs = chart.scales && chart.scales.x;
    if (!xs) return;
    const raw = xs.getValueForPixel(mx);
    let xIdx;
    if (typeof raw === 'number') xIdx = Math.round(raw);
    else if (typeof raw === 'string') xIdx = labels.indexOf(raw);
    else xIdx = Math.round(parseFloat(raw));
    if (xIdx < 0 || xIdx >= labels.length) return;
    plotlineCount++;
    const d = plotlineData;
    const xHeader = d.timeCol >= 0 ? (d.headers[d.timeCol] || 'X') : '索引';
    const xVal = d.xIsTime ? fmtTimeShort(d.times[xIdx]) : String(d.times[xIdx]);
    const cells = [{ label: xHeader, text: xVal }];
    cols.forEach(function(ci, i) {
      const col = d.numericCols[ci];
      // ds：對應的 dataset 索引（dataset 與 cols 同序建立），
      // 供圖例切換顯示時同步從表格移除該欄
      cells.push({
        label: d.headers[col] || ('欄' + (col + 1)),
        text: String(d.series[col][xIdx]),
        ds: i
      });
    });
    chart._plotlineRecords.push({ n: plotlineCount, sortKey: xIdx, cells: cells });
    renderPlotlineTable(outDiv, chart._plotlineRecords);
    chart._plotlineMarks.push({ x: xIdx, n: plotlineCount });
    redrawAllCharts();
  });
}

function parseTime(str) {
  if (!str) return null;
  str = str.replace(/^['"]/, '').trim();
  // 純數值（如 1,2,3 的流水號 sec）不視為日期
  if (/^\d+(\.\d+)?$/.test(str)) return null;
  // Try ISO format first
  let ts = new Date(str);
  if (!isNaN(ts.getTime())) return ts;
  // Try common formats with slashes
  const m = str.match(/(\d{4})[/-](\d{1,2})[/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) {
    ts = new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    if (!isNaN(ts.getTime())) return ts;
  }
  // Try MM/DD/YYYY or DD/MM/YYYY
  const m2 = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m2) {
    ts = new Date(+m2[3], +m2[1]-1, +m2[2], +(m2[4]||0), +(m2[5]||0), +(m2[6]||0));
    if (!isNaN(ts.getTime())) return ts;
  }
  return null;
}

function fmtTime(d) {
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getMonth()+1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function fmtTimeShort(d) {
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

// 依數列名稱尾端單位分組（不分大小寫），如 kPa / NLPM / 度
function getUnitKey(header) {
  let s = String(header).trim();
  // 先嘗試括號內的單位： "xxx (kPa)" / "xxx[度]" / "xxx_度"
  let m = s.match(/[\(\[（【]\s*([^\)\]）】\s]+)\s*[\)\]）】]?\s*$/);
  if (m) return m[1].trim();
  // 去除尾端標點再取最後一個 token
  s = s.replace(/[\s\)\]\}】）]+$/,'');
  let parts = s.split(/[\s_\-\/]+/);
  let last = parts[parts.length - 1] || s;
  last = last.replace(/^[^a-zA-Z0-9\u4e00-\u9fa5°℃]+|[^a-zA-Z0-9\u4e00-\u9fa5°℃]+$/g, '');
  return last || s;
}

// --- Axis manual range edit (double-click on axis) ---
function secOfDay(d) { return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); }
function findIdxByTime(times, str) {
  // 數值 X（如 sec）：直接找最接近的數值
  if (times.length && typeof times[0] === 'number') {
    const v = parseFloat(String(str).trim());
    if (isNaN(v)) return null;
    let best = -1, bestDiff = Infinity;
    for (let i = 0; i < times.length; i++) { const diff = Math.abs(times[i] - v); if (diff < bestDiff) { bestDiff = diff; best = i; } }
    return best;
  }
  const m = String(str).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  let target;
  if (m) target = (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3] || 0);
  else {
    const d = parseTime(str);
    if (!d) return null;
    target = secOfDay(d);
  }
  let best = -1, bestDiff = Infinity;
  for (let i = 0; i < times.length; i++) {
    if (!(times[i] instanceof Date)) continue;
    const diff = Math.abs(secOfDay(times[i]) - target);
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  }
  return best;
}

// 套用刻度間隔到軸設定（空字串 = 自動）
function applyAxisStep(opts, step) {
  if (!opts) return;
  if (!opts.ticks) opts.ticks = {};
  if (step === '' || step === null || step === undefined || isNaN(parseFloat(step))) {
    delete opts.ticks.stepSize;
  } else {
    opts.ticks.stepSize = parseFloat(step);
  }
}
function setupAxisEdit(chart, canvas, labels, times, timeCol) {
  canvas.addEventListener('dblclick', function(e) {
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Y axes: hit-test each scale's horizontal band
    const ids = Object.keys(chart.options.scales || {}).filter(k => k !== 'x');
    for (const id of ids) {
      const sc = chart.scales[id];
      if (!sc) continue;
      if (my >= ca.top - 5 && my <= ca.bottom + 5 && mx >= sc.left - 3 && mx <= sc.right + 3) {
        const axTitle = (sc.options.title && sc.options.title.text) || id;
        const opts = chart.options.scales[id];
        const defLo = opts.min !== undefined ? opts.min : sc.min;
        const defHi = opts.max !== undefined ? opts.max : sc.max;
        const isLinear = sc.type === 'linear';
        const defStep = isLinear && opts.ticks && typeof opts.ticks.stepSize === 'number' ? opts.ticks.stepSize : '';
        askRange('✏️ 手動設定 Y 軸範圍 — ' + axTitle, '起始值', defLo, '結束值', defHi, function(a, b, step) {
          const lo = parseFloat(a), hi = parseFloat(b);
          if (isNaN(lo) || isNaN(hi) || lo >= hi) { alert('請輸入有效數值（起始值需小於結束值）'); return; }
          opts.min = lo;
          opts.max = hi;
          if (isLinear) applyAxisStep(opts, step);
          chart.update('none');
        }, isLinear ? defStep : null);
        return;
      }
    }

    // X axis: band below chart area
    if (mx >= ca.left && mx <= ca.right && my > ca.bottom && my <= ca.bottom + 40) {
      const xs = chart.options.scales.x;
      const n = labels.length;
      let i0 = xs.min !== undefined ? Math.round(xs.min) : 0;
      let i1 = xs.max !== undefined ? Math.round(xs.max) : n - 1;
      // 多檔疊圖時較長檔案的補位標籤（'#i'）沒有任何資料 → 範圍上限收到最後一個有效索引
      let lastReal = n - 1;
      while (lastReal > 0 && typeof labels[lastReal] === 'string' && labels[lastReal].charAt(0) === '#') lastReal--;
      i0 = Math.max(0, Math.min(i0, lastReal));
      i1 = Math.max(0, Math.min(i1, lastReal));
      const xIsTime = times[0] instanceof Date;
      // 多檔疊圖時 X 軸長度取各檔最大值，較長檔案的補位標籤為 '#i' → 改用時間/數值本身
      const labelAt = function (i) {
        const s = labels[i];
        if (typeof s === 'string' && s.charAt(0) === '#') {
          if (xIsTime && times[i] instanceof Date) return fmtTime(times[i]);
          if (i >= 0 && i < times.length) return String(times[i]);
        }
        return s;
      };
      if (xIsTime) {
        askRange('⏱️ 手動設定 X 軸時間範圍', '起始時間 (HH:mm:ss)', labelAt(i0), '結束時間 (HH:mm:ss)', labelAt(i1), function(a, b) {
          const j0 = findIdxByTime(times, a);
          const j1 = findIdxByTime(times, b);
          if (j0 === null || j1 === null || j0 < 0 || j1 < 0) { alert('時間格式無法辨識，請輸入 HH:mm:ss'); return; }
          if (j0 >= j1) { alert('起始時間需早於結束時間'); return; }
          xs.min = j0;
          xs.max = j1;
          chart.update('none');
          applyZoomSync(chart);
        });
      } else if (timeCol >= 0) {
        const xHdr = (chart.options.scales.x.title && chart.options.scales.x.title.text) || 'X';
        const xSc = chart.scales.x;
        const xLinear = xSc && xSc.type === 'linear';
        const xStep = xLinear && xs.ticks && typeof xs.ticks.stepSize === 'number' ? xs.ticks.stepSize : '';
        askRange('🔢 手動設定 X 軸範圍 — ' + xHdr, '起始值', labelAt(i0), '結束值', labelAt(i1), function(a, b, step) {
          const j0 = findIdxByTime(times, a);
          const j1 = findIdxByTime(times, b);
          if (j0 === null || j1 === null || j0 < 0 || j1 < 0) { alert('數值格式無法辨識'); return; }
          if (j0 >= j1) { alert('起始值需小於結束值'); return; }
          xs.min = j0;
          xs.max = j1;
          if (xLinear) applyAxisStep(xs, step);
          chart.update('none');
          applyZoomSync(chart);
        }, xLinear ? xStep : null);
      } else {
        askRange('🔢 手動設定 X 軸索引範圍', '起始索引', i0, '結束索引', i1, function(a, b) {
          const j0 = parseInt(a, 10), j1 = parseInt(b, 10);
          if (isNaN(j0) || isNaN(j1) || j0 < 0 || j1 >= n || j0 >= j1) { alert('請輸入有效索引（0 ～ ' + (n - 1) + '，起始需小於結束）'); return; }
          xs.min = j0;
          xs.max = j1;
          chart.update('none');
          applyZoomSync(chart);
        });
      }
    }
  });
}

function isNumeric(val) {
  if (val === null || val === undefined || val === '') return false;
  return !isNaN(parseFloat(val)) && isFinite(val);
}

function decodeGenericBuffer(buf) {
  let text = null;
  if (buf.length >= 3 && buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF) {
    text = new TextDecoder('utf-8').decode(buf);
  } else {
    try { text = new TextDecoder('big5').decode(buf); } catch (e) { text = null; }
    if (text === null || text.indexOf('\uFFFD') !== -1) {
      try { text = new TextDecoder('utf-8').decode(buf); } catch (e) { text = ''; }
    }
  }
  return text.replace(/^\uFEFF/, '');
}

function readFileText(file) {
  return new Promise(function (resolve) {
    const reader = new FileReader();
    reader.onload = function (evt) { resolve(decodeGenericBuffer(new Uint8Array(evt.target.result))); };
    reader.onerror = function () { resolve(null); };
    reader.readAsArrayBuffer(file);
  });
}

// 依欄名合併各檔案的欄位（不分大小寫）
function multiColumnUnion(files) {
  const map = new Map();
  files.forEach(function (f) {
    f.numericCols.forEach(function (c) {
      const raw = (f.headers[c] || ('欄' + (c + 1))).trim();
      const key = raw.toLowerCase();
      if (!map.has(key)) map.set(key, { name: raw, refs: [] });
      map.get(key).refs.push({ file: f, col: c });
    });
  });
  return Array.from(map.values());
}

// 多檔：載入並顯示欄位選擇面板
function loadMultiFiles(fileList) {
  loading.style.display = 'block';
  const room = MULTI_MAX;
  const take = Array.from(fileList).slice(0, room);
  const skipped = fileList.length - take.length;
  Promise.all(take.map(function (f) {
    const k = fileKey(f);
    // 已解析過的檔案直接沿用結果，避免每加一個檔就重讀全部
    if (parsedCache.has(k)) {
      return Promise.resolve({ key: k, name: f.name, cached: parsedCache.get(k) });
    }
    return readFileText(f).then(function (t) {
      if (!t) return { key: k, name: f.name, cached: null };
      const a = analyzeTable(t);
      if (a) { a.name = f.name.replace(/\.[^.]+$/, ''); parsedCache.set(k, a); }
      return { key: k, name: f.name, cached: a };
    });
  }))
    .then(function (items) {
      multiFiles = [];
      items.forEach(function (it) {
        if (it.cached) multiFiles.push(it.cached);
      });
      loading.style.display = 'none';
      fileName.textContent = '已載入 ' + multiFiles.length + ' 個檔案（共 ' + multiFiles.length + '/' + MULTI_MAX + '）'
        + (skipped ? '，超出上限未載入 ' + skipped + ' 個' : '');
      if (!multiFiles.length) { alert('沒有可用的資料（每個檔案至少要有 2 筆以上資料）'); return; }
      renderMultiPanel();
    });
}

    checks.push({ id: id, col: c, name: c.name });

  document.getElementById('multiSelectAll').addEventListener('change', function () {
    const on = this.checked;
    checks.forEach(function (c) { document.getElementById(c.id).checked = on; });
  });
  document.getElementById('multiConfirm').addEventListener('click', function () {
    const picked = checks.filter(function (c) { return document.getElementById(c.id).checked; });
    if (!picked.length) { alert('請至少選擇一個欄位'); return; }
    // 記住這次勾了哪些欄位，加入其他檔案後重開面板時會預設勾回
    pickedColNames = new Set(picked.map(function (c) { return c.name.trim().toLowerCase(); }));
    columnConfigDiv.style.display = 'none';
    buildMultiChart(picked.map(function (p) { return p.col; }));
  });
  document.getElementById('multiClear').addEventListener('click', clearMultiCharts);
}

function buildMultiChart(selectedCols) {
  clearMultiChartsKeepFiles();
  const host = document.getElementById('multiCharts');
  const wrap = document.createElement('div');
  wrap.className = 'chart-container';
  wrap.innerHTML = '<h3>📈 多檔疊圖比較（' + multiFiles.length + ' 個檔案 / ' + selectedCols.length + ' 個欄位）</h3>'
    + '<div class="chart-wrap" style="height:62vh;min-height:380px"><canvas id="multiCanvas"></canvas></div>'
    + '<div class="zoom-hint">🖱️ 拖曳框選縮放 XY（需拖>10px） · Shift+拖曳平移'
    + '<button id="multiReset">↺ 重設</button>'
    + '<button id="multiClear2">🗑️ 清除全部曲線</button></div>';
  host.appendChild(wrap);
  const canvas = wrap.querySelector('#multiCanvas');

  // X 軸以第一個檔案的標籤為準；長度取各檔最大值，避免資料被截斷
  const labels0 = multiFiles[0].labels;
  let maxLen = labels0.length;
  multiFiles.forEach(function (f) { if (f.labels.length > maxLen) maxLen = f.labels.length; });
  const labels = labels0.slice();
  for (let i = labels0.length; i < maxLen; i++) labels.push('#' + i);
  const datasets = [];
  let colorIdx = 0;
  selectedCols.forEach(function (col) {
    col.refs.forEach(function (ref) {
      const data = ref.file.series[ref.col] || [];
      const n = Math.min(data.length, labels.length);
      const arr = new Array(labels.length).fill(null);
      for (let i = 0; i < n; i++) arr[i] = data[i];
      datasets.push({
        label: ref.file.name + '：' + col.name,
        data: arr,
        borderColor: MULTI_COLORS[colorIdx % MULTI_COLORS.length],
        backgroundColor: MULTI_COLORS[colorIdx % MULTI_COLORS.length],
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: 0.1,
        spanGaps: false,
        fill: false,
      });
      colorIdx++;
    });
  });

  const xTitle = multiFiles[0].xIsTime ? '時間' : (multiFiles[0].timeCol >= 0 ? (multiFiles[0].headers[multiFiles[0].timeCol] || 'X') : '索引');
  multiChart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      plugins: {
        legend: { labels: { color: ct('legend'), font: { size: 11 } } },
        tooltip: {
          backgroundColor: 'rgba(28,28,30,0.94)', titleColor: '#0a84ff', bodyColor: '#f5f5f7',
          borderColor: 'rgba(255,255,255,0.14)', borderWidth: 1,
        },
        zoom: {
          zoom: {
            wheel: { enabled: false },
            drag: { enabled: true, threshold: 10, backgroundColor: 'rgba(10,132,255,0.12)', borderColor: '#0a84ff', borderWidth: 1.5 },
            mode: 'xy',
            onZoomComplete: function (e) { applyZoomSync(e.chart); },
          },
          pan: { enabled: true, mode: 'xy', modifierKey: 'shift', onPanComplete: function (e) { applyZoomSync(e.chart); } },
        },
      },
      scales: {
        x: {
          ticks: { color: ct('xtick'), font: { size: 11 }, maxTicksLimit: 20 },
          grid: { color: ct('grid') },
          title: { display: true, text: xTitle, color: ct('axisTitle') },
        },
        y: {
          display: true,
          title: { display: true, text: '數值', color: ct('axisTitle') },
          ticks: { color: ct('xtick') },
          grid: { color: ct('grid') },
        },
      },
    },
  });
  setupCrosshair(multiChart, canvas, labels);
  // 雙擊 X／Y 軸可手動設定範圍與間隔（時間軸以第一個檔案的時間序列為準）
  setupAxisEdit(multiChart, canvas, labels, multiFiles[0].times, multiFiles[0].timeCol);
  allCharts.push(multiChart);

  wrap.querySelector('#multiReset').addEventListener('click', function () {
    if (!multiChart) return;
    try { multiChart.resetZoom(); } catch (e) {}
    // 清除雙擊軸範圍設定的手動 min/max 與刻度間隔
    Object.keys(multiChart.options.scales || {}).forEach(function (k) {
      const s = multiChart.options.scales[k];
      s.min = undefined;
      s.max = undefined;
      if (s.ticks) s.ticks.stepSize = undefined;
    });
    clearChartPlotline(multiChart);
    multiChart.update('none');
  });
  wrap.querySelector('#multiClear2').addEventListener('click', clearMultiCharts);
}

function clearMultiChartsKeepFiles() {
  if (multiChart) {
    try { const i = allCharts.indexOf(multiChart); if (i >= 0) allCharts.splice(i, 1); } catch (e) {}
    try { multiChart.destroy(); } catch (e) {}
    multiChart = null;
  }
  const host = document.getElementById('multiCharts');
  if (host) host.innerHTML = '';
}
// ===== IV 曲線圖（X = 電流, Y = 電壓），最多 6 個檔案疊圖比較 =====
const ivFileInput = document.getElementById('ivFileInput');
const ivFileName = document.getElementById('ivFileName');
const ivChartsDiv = document.getElementById('ivCharts');
const IV_MAX = 6;
const IV_COLORS = ['#0a84ff', '#ff9f0a', '#30d158', '#ff375f', '#bf5af2', '#64d2ff'];
let ivChart = null;
let ivSeries = [];   // [{ name, headers, numericCols, data, color }]
let ivSel = { xi: -1, yi: -1, tension: 0.25, showLine: true, showPts: false, showPower: false, stepFilter: true, stepTol: 0.05, showGrid: true };

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function ivBaseName(n) { return String(n).replace(/\.[^.]+$/, ''); }

function decodeCsvBuffer(buf) {
  let text;
  try { text = new TextDecoder('utf-8').decode(buf); } catch(err) { text = ''; }
  if (text.indexOf('\uFFFD') !== -1) {
    try { text = new TextDecoder('big5').decode(buf); } catch(err) { /* keep utf8 */ }
  }
  return text.replace(/^\uFEFF/, '');
}

function guessIVCols(headers, numericCols) {
  function guess(re) {
    for (const c of numericCols) if (re.test(headers[c])) return c;
    return -1;
  }
  let xi = guess(/^i\b|^i\s*\(|電流|current|^i_|^i[a-z]*\s*\(/i);
  let yi = guess(/^v\b|^v\s*\(|電壓|voltage|^v_|^v[a-z]*\s*\(|stack/i);
  if (xi === -1) xi = numericCols[0];
  if (yi === -1 || yi === xi) { for (const c of numericCols) if (c !== xi) { yi = c; break; } }
  // 功率欄（選用）
  let pi = -1;
  for (const c of numericCols) {
    if (c === xi || c === yi) continue;
    if (/power|watt|瓦|功率|^p\s*\(/i.test(headers[c])) { pi = c; break; }
  }
  return { xi: xi, yi: yi, pi: pi };
}

function parseIVText(csvText, filename) {
  const rows = [];
  // 先切除前導檔頭（.fcd 等），分隔符也要依「切除後」的內容判斷
  const stripped = stripPreamble(csvText);
  const lines = stripped.split(/\r?\n/);
  const delim = detectDelim(stripped);
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const r = parseCSVLine(lines[i], delim);
    if (r && r.length) rows.push(r);
  }
  if (rows.length < 2) return null;
  const headers = rows[0].map(function(h) { return h.replace(/^['"]|['"]$/g, '').trim(); });
  const data = rows.slice(1);
  const sample = Math.min(20, data.length);
  const need = Math.max(5, Math.ceil(sample * 0.8));
  const numericCols = [];
  for (let c = 0; c < headers.length; c++) {
    let cnt = 0;
    for (let r = 0; r < sample; r++) if (isNumeric(data[r][c])) cnt++;
    if (cnt >= need) numericCols.push(c);
  }
  if (numericCols.length < 2) return null;
  const g = guessIVCols(headers, numericCols);
  return { name: ivBaseName(filename), headers: headers, numericCols: numericCols, data: data, xi: g.xi, yi: g.yi, pi: g.pi };
}

function readIVFile(file) {
  return new Promise(function(resolve) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      try { resolve(parseIVText(decodeCsvBuffer(new Uint8Array(evt.target.result)), file.name)); }
      catch(err) { resolve(null); }
    };
    reader.onerror = function() { resolve(null); };
    reader.readAsArrayBuffer(file);
  });
}

ivFileInput.addEventListener('change', async function(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  const room = IV_MAX - ivSeries.length;
  if (room <= 0) {
    ivFileName.textContent = '已達上限 ' + IV_MAX + ' 個檔案，請先移除部分曲線';
    e.target.value = '';
    return;
  }
  const take = files.slice(0, room);
  const skipped = files.length - take.length;
  const loaded = [];
  for (const f of take) loaded.push(await readIVFile(f));
  loaded.forEach(function(s) {
    if (!s) return;
    if (ivSeries.length >= IV_MAX) return;
    s.color = IV_COLORS[ivSeries.length % IV_COLORS.length];
    ivSeries.push(s);
  });
  const okN = loaded.filter(Boolean).length;
  const msg = '已載入 ' + okN + ' 個檔案（共 ' + ivSeries.length + '/' + IV_MAX + '）';
  ivFileName.textContent = msg + (skipped ? '，超出上限未載入 ' + skipped + ' 個' : '');
  e.target.value = '';
  // 第一次載入時沿用該檔的欄位判斷；之後依第一個檔案為準顯示
  if (okN && ivSel.xi === -1) {
    const first = loaded.find(Boolean);
    ivSel.xi = first.xi; ivSel.yi = first.yi;
  }
  renderIVChart();
});

function ivPointsOf(s, xi, yi) {
  const pts = [];
  const d = s.data;
  // 欄位超出此檔範圍 → 沒有可用的點
  if (xi >= s.headers.length || yi >= s.headers.length) return pts;
  for (let r = 0; r < d.length; r++) {
    const x = parseFloat(d[r][xi]);
    const y = parseFloat(d[r][yi]);
    if (isFinite(x) && isFinite(y)) pts.push({ x: x, y: y });
  }
  // 依 X 由小到大排序：資料可能是「定電流→掃描→回定電流」等非單調順序，
  // 不排序會讓 Chart.js（parsing:false）算錯 X 軸範圍
  pts.sort(function(a, b) { return a.x - b.x; });
  return pts;
}

function ivRefSeries() { return ivSeries[0] || null; }

// IV 散布圖：雙擊 X／Y 軸設定上下限與刻度間隔（右側功率軸也可）
function setupIVAxisEdit(chart, canvas) {
  canvas.addEventListener('dblclick', function(e) {
    const ca = chart.chartArea;
    if (!ca) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Y 軸（含右側功率軸 yPow）
    const yIds = ['y', 'yPow'];
    for (let i = 0; i < yIds.length; i++) {
      const id = yIds[i];
      const sc = chart.scales[id];
      if (!sc) continue;
      if (sc.options && sc.options.display === false) continue;
      if (my >= ca.top - 6 && my <= ca.bottom + 6 && mx >= sc.left - 4 && mx <= sc.right + 4) {
        const opts = chart.options.scales[id];
        const title = (sc.options.title && sc.options.title.text) || (id === 'yPow' ? 'Power' : 'Y');
        const defLo = opts.min !== undefined ? opts.min : sc.min;
        const defHi = opts.max !== undefined ? opts.max : sc.max;
        const defStep = (opts.ticks && typeof opts.ticks.stepSize === 'number') ? opts.ticks.stepSize : '';
        askRange('✏️ 手動設定軸範圍 — ' + title, '起始值', defLo, '結束值', defHi, function(a, b, step) {
          const lo = parseFloat(a), hi = parseFloat(b);
          if (isNaN(lo) || isNaN(hi) || lo >= hi) { alert('請輸入有效數值（起始值需小於結束值）'); return; }
          opts.min = lo;
          opts.max = hi;
          applyAxisStep(opts, step);
          chart.update('none');
        }, defStep);
        return;
      }
    }

    // X 軸：圖表區下方
    if (mx >= ca.left && mx <= ca.right && my > ca.bottom && my <= ca.bottom + 40) {
      const opts = chart.options.scales.x;
      const sc = chart.scales.x;
      const defLo = opts.min !== undefined ? opts.min : sc.min;
      const defHi = opts.max !== undefined ? opts.max : sc.max;
      const defStep = (opts.ticks && typeof opts.ticks.stepSize === 'number') ? opts.ticks.stepSize : '';
      const xTitle = (sc.options.title && sc.options.title.text) || 'X';
      askRange('✏️ 手動設定軸範圍 — ' + xTitle, '起始值', defLo, '結束值', defHi, function(a, b, step) {
        const lo = parseFloat(a), hi = parseFloat(b);
        if (isNaN(lo) || isNaN(hi) || lo >= hi) { alert('請輸入有效數值（起始值需小於結束值）'); return; }
        opts.min = lo;
        opts.max = hi;
        applyAxisStep(opts, step);
        chart.update('none');
      }, defStep);
    }
  });
}

// 階梯取樣：只保留「定電流平台」（同一電流連續取樣多筆）的最後一筆電壓，
// 也就是電流改變前的那一筆；平台之間的過渡爬升點不畫，避免畫出垂直震盪線段。
function ivStepFilter(pts) {
  if (!ivSel.stepFilter || !pts.length) return pts;
  const tol = ivSel.stepTol;
  const groups = [];
  let g = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (Math.abs(pts[i].x - g[0].x) <= tol) g.push(pts[i]);
    else { groups.push(g); g = [pts[i]]; }
  }
  groups.push(g);
  // 「定電流平台」= 同一電流連續取樣很多筆；門檻隨資料量自動調整
  const minRun = Math.max(3, Math.ceil(pts.length * 0.005));
  // 只有當「重複取樣的平台點」占絕大多數（≥80%）時，才視為階梯資料而只留平台末筆。
  // 否則（例如少量取樣、含真正掃描段的資料）保留全部點，避免把曲線丟掉。
  let longPts = 0;
  groups.forEach(function(gr) { if (gr.length >= minRun) longPts += gr.length; });
  if (longPts < pts.length * 0.8) return pts;
  const kept = groups.filter(function(gr) { return gr.length >= minRun; })
                    .map(function(gr) { return gr[gr.length - 1]; });
  if (kept.length < 2) return pts;
  return kept;
}

function ivPowerPoints(s, xi) {
  if (s.pi === undefined || s.pi === -1) return null;
  const pts = [];
  const d = s.data;
  if (xi >= s.headers.length || s.pi >= s.headers.length) return null;
  for (let r = 0; r < d.length; r++) {
    const x = parseFloat(d[r][xi]);
    const y = parseFloat(d[r][s.pi]);
    if (isFinite(x) && isFinite(y)) pts.push({ x: x, y: y });
  }
  if (!pts.length) return null;
  pts.sort(function(a, b) { return a.x - b.x; });
  return pts;
}

// 沒有 Power 欄時，用 P = I × V 計算功率（與已畫出的 IV 點一致）
function ivPowerFromIV(ivPts) {
  if (!ivPts || !ivPts.length) return null;
  const pts = [];
  for (let i = 0; i < ivPts.length; i++) pts.push({ x: ivPts[i].x, y: ivPts[i].x * ivPts[i].y });
  return pts;
}
function ivHasPowerCol(s) { return !(s.pi === undefined || s.pi === -1 || s.pi >= s.headers.length); }
function ivPowerTitle() {
  const ref = ivRefSeries();
  if (ref && ivHasPowerCol(ref)) return ref.headers[ref.pi] || 'Power (Watts)';
  return 'Power (W) = I × V（計算值）';
}

// 各檔案用「自己的」X/Y 欄位（欄位數不同的檔案也能正確疊圖）
function ivColsOf(s) { return { xi: s.xi, yi: s.yi }; }

// 使用者切換欄位時：先依欄名比對套用到各檔案，其次才用相同索引
function ivApplyCols(nx, ny) {
  const ref = ivRefSeries();
  if (!ref) return;
  const norm = function(v) { return String(v || '').trim().toLowerCase(); };
  const xName = norm(ref.headers[nx]);
  const yName = norm(ref.headers[ny]);
  ivSeries.forEach(function(s) {
    if (nx >= 0 && nx !== s.xi) {
      if (s.xi === nx) return;
      let found = -1;
      for (let c = 0; c < s.headers.length; c++) {
        if (norm(s.headers[c]) === xName) { found = c; break; }
      }
      s.xi = (found !== -1) ? found : (nx < s.headers.length ? nx : s.xi);
    }
    if (ny >= 0 && ny !== s.yi) {
      if (s.yi === ny) return;
      let found = -1;
      for (let c = 0; c < s.headers.length; c++) {
        if (norm(s.headers[c]) === yName) { found = c; break; }
      }
      s.yi = (found !== -1) ? found : (ny < s.headers.length ? ny : s.yi);
    }
  });
}

// 依目前選用狀況組出所有 dataset（IV 曲線 + 功率曲線）
function ivBuildDatasets() {
  const list = [];
  const ivDataMap = [];
  ivSeries.forEach(function(s) {
    const c = ivColsOf(s);
    const pts = ivStepFilter(ivPointsOf(s, c.xi, c.yi));
    ivDataMap.push(pts);
    list.push({
      _kind: 'iv',
      label: s.name,
      data: pts,
      parsing: false,
      showLine: ivSel.showLine,
      borderColor: s.color,
      backgroundColor: s.color,
      borderWidth: ivSel.showLine ? 2 : 0,
      tension: ivSel.tension,
      pointRadius: ivSel.showPts ? 2.5 : 0,
      pointHoverRadius: 4,
      pointBackgroundColor: s.color,
      fill: false,
    });
  });
  if (ivSel.showPower) {
    ivSeries.forEach(function(s, i) {
      const c = ivColsOf(s);
      let p, tag;
      if (ivHasPowerCol(s)) { p = ivStepFilter(ivPowerPoints(s, c.xi)); tag = ' 功率'; }
      else { p = ivPowerFromIV(ivDataMap[i]); tag = ' 功率（計算 I×V）'; }
      if (!p) return;
      list.push({
        _kind: 'power',
        label: s.name + tag,
        data: p,
        parsing: false,
        showLine: true,
        borderColor: s.color,
        backgroundColor: s.color,
        borderWidth: 1.6,
        borderDash: [6, 3],
        tension: ivSel.tension,
        pointRadius: ivSel.showPts ? 2 : 0,
        pointHoverRadius: 4,
        pointBackgroundColor: s.color,
        fill: false,
        yAxisID: 'yPow',
      });
    });
  }
  return list;
}

function renderIVChart() {
if (ivChart) { try { ivChart.destroy(); } catch(e) {} ivChart = null; }
ivChartsDiv.innerHTML = '';
// 圖表重建 → 先前的讀值列已無效
ivPlotlineRecords = [];
ivPlotlineMarks = [];
ivCrosshairX = null;
if (!ivSeries.length) return;
  const ref = ivRefSeries();

  const wrap = document.createElement('div');
  wrap.className = 'chart-container';
  wrap.innerHTML = '<h3>⚡ IV 曲線比較（最多 ' + IV_MAX + ' 個檔案疊圖）</h3>'
    + '<div id="ivSelRow" style="margin-bottom:6px;font-size:12px;color:var(--stat)"></div>'
    + '<div id="ivOptRow" style="margin-bottom:10px;font-size:12px;color:var(--stat);display:flex;align-items:center;gap:14px;flex-wrap:wrap"></div>'
    + '<div class="chart-wrap" style="height:64vh;min-height:380px"><canvas id="ivCanvas"></canvas></div>'
    + '<div class="zoom-hint">🖱️ 拖曳框選縮放 XY（需拖>10px） · Shift+拖曳平移'
    + '<button type="button" id="ivReset">↺ 重設</button>'
    + '<button type="button" id="ivClear">🗑️ 清除全部曲線</button></div>';
  ivChartsDiv.appendChild(wrap);

  // 欄位選擇（依第一個檔案的欄位；套用所有檔案）
  const selRow = wrap.querySelector('#ivSelRow');
  const mkOpts = function(exclude) {
    let s = '';
    for (const c of ref.numericCols) {
      if (c === exclude) continue;
      s += '<option value="' + c + '">' + escHtml(ref.headers[c] || ('欄' + (c + 1))) + '</option>';
    }
    return s;
  };
  selRow.innerHTML = '<label style="margin-right:16px;display:inline-flex;align-items:center;gap:6px">'
    + 'X 軸（電流）：<select id="ivSelX" style="background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px">'
    + mkOpts(ivSel.yi) + '</select></label>'
    + '<label style="display:inline-flex;align-items:center;gap:6px">'
    + 'Y 軸（電壓）：<select id="ivSelY" style="background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:3px;padding:2px 6px;font-size:11px">'
    + mkOpts(ivSel.xi) + '</select></label>'
    + '<span id="ivPointInfo"></span>';

// 解析資料表 → { headers, numericCols, times, series, labels, timeCol, xIsTime }
function analyzeTable(csvText) {
  try {
    // 先切除前導檔頭（.fcd 等），分隔符也要依「切除後」的內容判斷
    const stripped = stripPreamble(csvText);
    const lines = stripped.trim().split('\n');
    if (lines.length < 2) { loading.style.display = 'none'; return; }
    const delim = detectDelim(stripped);

    const rawHeaders = parseCSVLine(lines[0], delim);
    const headers = rawHeaders.map(h => {
      let s = h.replace(/^['"]|['"]$/g, '').trim().replace(/^\uFEFF/, '');
      if (s.includes('ime (Sec)')) s = s.replace(/^.*ime/, 'Time');
      s = s.replace(/^[^\w\(]+/, '').trim();
      return s || h.trim();
    });

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCSVLine(lines[i], delim);
      if (cols.length < 2) continue;
      rows.push(cols.map(c => {
        c = c.replace(/^['"]|['"]$/g, '').trim();
        return c;
      }));
    }
    if (rows.length < 2) { loading.style.display = 'none'; return; }

    let timeCol = -1;
    const timeKeywords = ['time', 'date', 'datetime', 'timestamp', '時間', '日期', '日付'];
    for (let c = 0; c < headers.length; c++) {
      const hl = headers[c].toLowerCase();
      if (timeKeywords.some(kw => hl.includes(kw))) {
        let parsed = 0;
        for (let r = 0; r < Math.min(5, rows.length); r++) {
          if (parseTime(rows[r][c])) parsed++;
        }
        if (parsed >= 3) { timeCol = c; break; }
      }
    }
    if (timeCol < 0) {
      let parsed = 0;
      for (let r = 0; r < Math.min(5, rows.length); r++) {
        if (parseTime(rows[r][0])) parsed++;
      }
      if (parsed >= 3) timeCol = 0;
    }

    const numericCols = [];
    for (let c = 0; c < headers.length; c++) {
      if (c === timeCol) continue;
      let numCount = 0;
      for (let r = 0; r < Math.min(10, rows.length); r++) {
        if (isNumeric(rows[r][c])) numCount++;
      }
      if (numCount >= 8) numericCols.push(c);
    }
    // 若無日期欄，檢查 A 欄是否為數值流水號（如 sec），改以 A 欄作為 X 軸
    let xCol = timeCol;
    let xIsTime = timeCol >= 0;
    if (timeCol < 0) {
      let cnt0 = 0;
      for (let r = 0; r < Math.min(10, rows.length); r++) if (isNumeric(rows[r][0])) cnt0++;
      if (cnt0 >= 8) {
        xCol = 0;
        xIsTime = false;
        headers[0] = headers[0].replace(/^\uFEFF/, '').replace(/^[^\x20-\x7E\u4e00-\u9fa5\(]+/, '').trim() || headers[0].trim();
        const p = numericCols.indexOf(0);
        if (p !== -1) numericCols.splice(p, 1);
      } else {
        xCol = -1;
        xIsTime = false;
      }
    }
    if (numericCols.length === 0) { loading.style.display = 'none'; return; }

    const times = [];
    const series = {};
    for (const c of numericCols) series[c] = [];

    for (let r = 0; r < rows.length; r++) {
      let t;
      if (xIsTime) {
        t = parseTime(rows[r][xCol]);
        if (!t || isNaN(t.getTime())) continue;
      } else if (xCol >= 0) {
        const v = rows[r][xCol];
        t = isNumeric(v) ? parseFloat(v) : null;
        if (t === null) continue;
      } else {
        t = r;
      }
      times.push(t);
      for (const c of numericCols) {
        series[c].push(isNumeric(rows[r][c]) ? parseFloat(rows[r][c]) : 0);
      }
    }
    if (times.length < 2) { loading.style.display = 'none'; return; }

    const labels = xIsTime ? times.map(d => fmtTimeShort(d)) : times.map(v => String(v));
    if (xCol >= 0) headers[xCol] = headers[xCol].replace(/^\uFEFF/, '').replace(/^[^\w\(]+/, '').trim() || headers[xCol].trim();
    return { headers: headers, numericCols: numericCols, times: times, series: series, labels: labels, timeCol: xCol, xIsTime: xIsTime };
  } catch (e) { return null; }
}
